<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <title>KLAP MARATHON TIMER</title>
    <style>
        :root {
            --hrc-red: #D40024;
            --hrc-orange: #D96B00;
            --hrc-blue: #0077cc;
            --bg-light: #ffffff;
            --text-dark: #000000;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #dashboard {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px;
            gap: 6px;
        }
        .main-ui-container {
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px 12px;
            flex-shrink: 0;
        }
        .time-row-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #stline-lap,
        #display1 {
            font-size: 46px;
            font-weight: 900;
            line-height: 1.04;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }
        #stline-lap {
            color: var(--hrc-blue);
        }
        #display1 {
            color: var(--text-dark);
        }
        .sub-times {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-top: 6px;
        }
        .best-label {
            background: var(--hrc-red);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 4px;
        }
        #map-wrapper {
            width: 100%;
            height: 185px;
            min-height: 150px;
            border: 1px solid #bbb;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: #eaeaea;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .right-section-wrapper {
            display: flex;
            gap: 6px;
            flex: 1;
            min-height: 0;
        }
        #lap-panel {
            flex: 1;
            background: #fafafa;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 6px 8px;
            overflow-y: auto;
            font-variant-numeric: tabular-nums;
        }
        .lap-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 6px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 13px;
            font-weight: bold;
        }
        .lap-row.best-lap {
            background: #ffe8ec;
            color: var(--hrc-red);
        }
        .lap-row.sector-row {
            background: #e6f7fa;
            color: #005f6b;
        }
        .data-column {
            width: 104px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
            flex-shrink: 0;
        }
        .data-box {
            background: #f4f6f8;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .data-box .label {
            font-size: 10px;
            font-weight: bold;
            color: #555;
        }
        .data-box .val {
            font-size: 16px;
            font-weight: 900;
            color: #000;
            font-variant-numeric: tabular-nums;
        }
        #debug-info {
            font-size: 10px;
            font-family: monospace;
            background: #222;
            color: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            overflow-x: auto;
            flex-shrink: 0;
        }
        footer {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 2px;
            flex-shrink: 0;
        }
        footer button {
            flex: 1;
            min-width: 64px;
            padding: 10px 6px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #888;
            border-radius: 6px;
            background: #f2f2f2;
            color: #000;
            cursor: pointer;
            touch-action: manipulation;
        }
        footer button.active {
            background: var(--hrc-red);
            color: #fff;
            border-color: var(--hrc-red);
        }
        footer button.paused {
            background: var(--hrc-orange) !important;
            color: #fff !important;
            border-color: var(--hrc-orange);
        }
        #history-page {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            color: #000;
            z-index: 10000;
            padding: 16px;
            box-sizing: border-box;
        }
        .close-btn {
            background: var(--hrc-red);
            color: #fff;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 6px;
        }
        #history-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        #history-table th {
            color: var(--hrc-red);
            border-bottom: 2px solid var(--hrc-red);
            padding: 8px 4px;
            font-weight: bold;
        }
        #history-table td {
            padding: 8px 4px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div id="dashboard">
    <div class="main-ui-container">
        <div class="time-row-group">
            <div id="stline-lap">00:00.000</div>
            <div id="display1">00:00.000</div>
        </div>
        <div class="sub-times">
            <div id="display">TOTAL 00:00.000</div>
            <div id="best-display"><span class="best-label">BEST LAP</span>00:00.000</div>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <div class="right-section-wrapper">
        <div id="lap-panel">
            <div id="lap"></div>
        </div>
        <div class="data-column">
            <div class="data-box"><div class="label">SPD</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">SEC DIST</div><div class="val" id="sec_dist_val">0m</div></div>
            <div class="data-box"><div class="label">DIST</div><div class="val" id="dist_val">0m</div></div>
        </div>
    </div>

    <div id="debug-info">
        LAT: <span id="debug-lat">0.000000</span> | LON: <span id="debug-lon">0.000000</span> | ACC: <span id="debug-acc">0</span>m | INTV: <span id="debug-intv">0</span>m | LAPS: <span id="debug-laps">∞</span>
    </div>

    <footer>
        <button id="intGpsBtn" type="button">INT GPS</button>
        <button id="startBtn" type="button">START</button>
        <button id="pauseBtn" type="button">PAUSE</button>
        <button id="lapBtn" type="button">LAP</button>
        <button id="historyBtn" type="button">HISTORY</button>
        <button id="analyzerBtn" type="button" onclick="location.href='analyzer_3.html'">ANALYZER</button>
        <button id="gpxBtn" type="button" style="display:none; background:var(--hrc-orange); color:#fff; border-color:var(--hrc-orange);">GPX</button>
        <button id="settingsBtn" type="button" onclick="location.href='index.html'">SET</button>
        <button id="reloadBtn" type="button" onclick="location.reload()">RELOAD</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE</div>
    <div style="overflow-y: auto; height: calc(100% - 70px);">
        <table id="history-table">
            <thead>
                <tr><th>LAP</th><th>SEC DIST</th><th>SPLIT</th><th>LAP TIME</th><th>PACE(/km)</th><th>MAX</th></tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
'use strict';

if (localStorage.getItem('klap_auth_v1') !== "a2xhcDIwMjY=") {
    alert("認証が必要です。設定画面からパスワードを入力してください。");
    location.href = "index.html";
}

let swState = 0; // 0:待機, 1:計測中, 2:停止, 3:一時停止(PAUSE)
let startTime = 0;
let pauseStartTime = 0;
let pausedAccumulatedMs = 0;
let startLineCrossTime = null;

// 距離ラップ（D1, D2...）独立管理用
let distLapCounter = 0;
let lastDistanceLapTime = 0;
let distanceBaseM = 0;

// 任意セクター・折り返し（S1...）独立管理用
let lastSectorCrossTime = 0;
let lastSectorCrossDistM = 0;

// 周回ラップ（L1, L2...）管理用
let circuitLapCounter = 0;
let currentLapStartTime = 0;
let lastLapCrossTime = 0;

let lapRecords = [];

let currentSpeedKmh = 0;
let maxSpeedInLap = 0;
let lastPos = null;
let lastAltitudeM = null;
let currentLapPoints = [];

let isFrozen = false;
let freezeDisplayTime = "00:00.000";
let freezeUntil = 0;

let courseMode = 'marathon'; // 'marathon' | 'circuit'
let targetCircuitLaps = 0; // 0 = 無制限
const SECTOR_KEYS = Array.from({ length: 10 }, (_, i) => `sec${i + 1}Line`);
let lines = { startLine: null, goalLine: null, turnLine: null, lapLine: null, sectors: {} };
let hasAnySectorLine = false;
let triggeredSectors = {};
let turnTriggered = false;
let seqSectorCounter = 0;
let validStartDirection = null;
let startTriggered = false;

let lapIntervalM = 0;
let totalDistanceM = 0;
let nextLapDistanceM = 0;
let watchId = null;
const startCooldownMs = 5000;
const lapCooldownMs = 5000;
const sectorCooldownMs = 3000;

let map = null;
let currentMarker = null;
let trackPolyline = null;
let trackLatLngs = [];
let mapCenteredOnce = false;

function getEffectiveTime(rawNow = Date.now()) {
    const activePauseMs = (swState === 3 && pauseStartTime > 0)
        ? Math.max(0, rawNow - pauseStartTime)
        : 0;
    return rawNow - pausedAccumulatedMs - activePauseMs;
}

function resetPauseButtonUI() {
    const pauseBtn = document.getElementById('pauseBtn');
    if (!pauseBtn) return;
    pauseBtn.textContent = 'PAUSE';
    pauseBtn.classList.remove('paused');
}

function syncMapAspectRatio() {
    const wrapper = document.getElementById('map-wrapper');
    if (!wrapper) return;
    const w = wrapper.clientWidth;
    if (w > 0) {
        const h = Math.max(155, Math.min(260, Math.round(w / 2.2)));
        wrapper.style.height = `${h}px`;
    }
    if (map) {
        map.invalidateSize();
    }
}

function initMap() {
    if (typeof L === 'undefined') return;
    syncMapAspectRatio();

    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([35.68, 139.76], 16);

    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
        maxZoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
    }).addTo(map);

    trackPolyline = L.polyline([], { color: '#D40024', weight: 4 }).addTo(map);

    if (lines.startLine) {
        L.polyline(
            [[lines.startLine.p1.lat, lines.startLine.p1.lon], [lines.startLine.p2.lat, lines.startLine.p2.lon]],
            { color: '#E4002B', weight: 4 }
        ).addTo(map);
        map.setView([lines.startLine.p1.lat, lines.startLine.p1.lon], 17);
        mapCenteredOnce = true;
    }
    if (lines.goalLine) {
        L.polyline(
            [[lines.goalLine.p1.lat, lines.goalLine.p1.lon], [lines.goalLine.p2.lat, lines.goalLine.p2.lon]],
            { color: '#28a745', weight: 4 }
        ).addTo(map);
    }
    if (lines.turnLine) {
        L.polyline(
            [[lines.turnLine.p1.lat, lines.turnLine.p1.lon], [lines.turnLine.p2.lat, lines.turnLine.p2.lon]],
            { color: '#ff6d00', weight: 4 }
        ).addTo(map);
        if (!mapCenteredOnce) {
            map.setView([lines.turnLine.p1.lat, lines.turnLine.p1.lon], 17);
            mapCenteredOnce = true;
        }
    }
    if (lines.lapLine) {
        L.polyline(
            [[lines.lapLine.p1.lat, lines.lapLine.p1.lon], [lines.lapLine.p2.lat, lines.lapLine.p2.lon]],
            { color: '#9c27b0', weight: 4 }
        ).addTo(map);
        if (!mapCenteredOnce) {
            map.setView([lines.lapLine.p1.lat, lines.lapLine.p1.lon], 17);
            mapCenteredOnce = true;
        }
    }
    SECTOR_KEYS.forEach((key) => {
        const sLine = lines.sectors[key];
        if (sLine) {
            L.polyline(
                [[sLine.p1.lat, sLine.p1.lon], [sLine.p2.lat, sLine.p2.lon]],
                { color: '#00838f', weight: 3, dashArray: '5, 5' }
            ).addTo(map);
            if (!mapCenteredOnce) {
                map.setView([sLine.p1.lat, sLine.p1.lon], 17);
                mapCenteredOnce = true;
            }
        }
    });

    setTimeout(syncMapAspectRatio, 150);
}

function updateMapPosition(lat, lon) {
    if (!map) return;
    const latlng = [lat, lon];

    if (!currentMarker) {
        currentMarker = L.circleMarker(latlng, {
            radius: 6,
            color: '#ffffff',
            weight: 2,
            fillColor: '#0077cc',
            fillOpacity: 1
        }).addTo(map);
    } else {
        currentMarker.setLatLng(latlng);
    }

    if (swState === 1) {
        trackLatLngs.push(latlng);
        trackPolyline.setLatLngs(trackLatLngs);
    }

    if (!mapCenteredOnce) {
        map.setView(latlng, 17);
        mapCenteredOnce = true;
    } else if (swState === 1 || swState === 3) {
        map.panTo(latlng, { animate: false });
    }
}

function calcDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        return {
            time: p1.time + (p2.time - p1.time) * t,
            dir: ((x4 - x3) * (y2 - y1) - (y4 - y3) * (x2 - x1)) > 0 ? 1 : -1
        };
    }
    return null;
}

function recordDistanceSegmentLap(hitTime, targetDistM, segDistanceM, isManual) {
    const baseTime = lastDistanceLapTime || startLineCrossTime || startTime;
    const lapMs = Math.max(0, hitTime - baseTime);
    const splitBase = startLineCrossTime || startTime;
    const splitMs = Math.max(0, hitTime - splitBase);
    const cleanSegDistM = Math.max(0, Math.round(segDistanceM));

    distLapCounter++;
    const distKm = Math.max(0.001, cleanSegDistM / 1000);
    const paceSecPerKm = (lapMs / 1000) / distKm;

    const record = {
        no: distLapCounter,
        label: `D${distLapCounter}(${cleanSegDistM}m)`,
        kind: 'distance',
        targetDistM: Math.round(targetDistM),
        segDistanceM: cleanSegDistM,
        splitMs: splitMs,
        lapMs: lapMs,
        paceSecPerKm: paceSecPerKm,
        max: maxSpeedInLap,
        points: [...currentLapPoints]
    };

    lapRecords.unshift(record);
    updateLapList();
    localStorage.setItem('marathon_last_laps', JSON.stringify([...lapRecords].reverse()));

    if (!isManual) {
        isFrozen = true;
        freezeDisplayTime = timeFormat(lapMs);
        freezeUntil = Date.now() + 5000;
    }

    lastDistanceLapTime = hitTime;
    distanceBaseM = totalDistanceM;
    currentLapPoints = [];
    maxSpeedInLap = 0;
}

function recordCustomSectorLap(hitTime, targetDistM, segDistanceM, tagName) {
    const baseTime = lastSectorCrossTime || startLineCrossTime || startTime;
    const lapMs = Math.max(0, hitTime - baseTime);
    const splitBase = startLineCrossTime || startTime;
    const splitMs = Math.max(0, hitTime - splitBase);
    const cleanSegDistM = Math.max(0, Math.round(segDistanceM));

    const distKm = Math.max(0.001, cleanSegDistM / 1000);
    const paceSecPerKm = (lapMs / 1000) / distKm;

    const record = {
        no: lapRecords.length + 1,
        label: `${tagName}(${cleanSegDistM}m)`,
        kind: 'sector',
        targetDistM: Math.round(targetDistM),
        segDistanceM: cleanSegDistM,
        splitMs: splitMs,
        lapMs: lapMs,
        paceSecPerKm: paceSecPerKm,
        max: maxSpeedInLap,
        points: []
    };

    lapRecords.unshift(record);
    updateLapList();
    localStorage.setItem('marathon_last_laps', JSON.stringify([...lapRecords].reverse()));

    lastSectorCrossTime = hitTime;
    lastSectorCrossDistM = totalDistanceM;
}

function recordCircuitLap(hitTime, targetDistM, segDistanceM) {
    const baseTime = currentLapStartTime || startTime;
    const lapMs = Math.max(0, hitTime - baseTime);
    const splitBase = startLineCrossTime || startTime;
    const splitMs = Math.max(0, hitTime - splitBase);
    const cleanSegDistM = Math.max(0, Math.round(segDistanceM));

    circuitLapCounter++;
    const distKm = Math.max(0.001, cleanSegDistM / 1000);
    const paceSecPerKm = (lapMs / 1000) / distKm;

    const record = {
        no: circuitLapCounter,
        label: `L${circuitLapCounter}(${cleanSegDistM}m)`,
        kind: 'circuit',
        targetDistM: Math.round(targetDistM),
        segDistanceM: cleanSegDistM,
        splitMs: splitMs,
        lapMs: lapMs,
        paceSecPerKm: paceSecPerKm,
        max: maxSpeedInLap,
        points: [...currentLapPoints]
    };

    lapRecords.unshift(record);
    updateLapList();
    localStorage.setItem('marathon_last_laps', JSON.stringify([...lapRecords].reverse()));

    isFrozen = true;
    freezeDisplayTime = timeFormat(lapMs);
    freezeUntil = Date.now() + 5000;

    currentLapStartTime = hitTime;
    lastSectorCrossTime = hitTime;
    lastSectorCrossDistM = totalDistanceM;
    distanceBaseM = totalDistanceM;
    triggeredSectors = {};
    turnTriggered = false;
    seqSectorCounter = 0;
    currentLapPoints = [];
    maxSpeedInLap = 0;
}

function updateLapList() {
    if (lapRecords.length === 0) {
        document.getElementById('lap').innerHTML = '';
        return;
    }
    const lapOnly = lapRecords.filter(r => r.kind === 'circuit' || r.kind === 'distance');
    const best = lapOnly.length > 0
        ? Math.min(...lapOnly.map(r => r.lapMs))
        : Math.min(...lapRecords.map(r => r.lapMs));
    document.getElementById('best-display').innerHTML = `<span class="best-label">BEST LAP</span>${timeFormat(best)}`;

    document.getElementById('lap').innerHTML = lapRecords.map(r => {
        const isSector = (r.kind === 'sector');
        const rowClass = isSector ? 'sector-row' : (r.lapMs === best ? 'best-lap' : '');
        const displayLabel = `${r.label.split('(')[0]}(${r.segDistanceM}m)`;
        return `
        <div class="lap-row ${rowClass}">
            <span>${displayLabel}</span>
            <span>${timeFormat(r.lapMs)}</span>
        </div>`;
    }).join('');
}

function formatPace(secPerKm) {
    if (!isFinite(secPerKm) || secPerKm <= 0) return "--'--\"";
    const totalSec = Math.round(secPerKm);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    return `${min}'${sec.toString().padStart(2, '0')}"`;
}

function getCurrentSectorDistM() {
    const baseM = (courseMode === 'circuit')
        ? Math.max(lastSectorCrossDistM, 0)
        : lastSectorCrossDistM;
    return Math.max(0, Math.round(totalDistanceM - baseM));
}

function handlePositionUpdate(currLat, currLon, rawNow, acc = 0, rawSpeedMps = null, rawAltitudeM = null) {
    if (currLat === 0 && currLon === 0) return;
    document.getElementById('debug-lat').textContent = currLat.toFixed(6);
    document.getElementById('debug-lon').textContent = currLon.toFixed(6);
    document.getElementById('debug-acc').textContent = Math.round(acc);

    updateMapPosition(currLat, currLon);

    if (swState === 3) {
        lastPos = null;
        return;
    }

    const effNow = getEffectiveTime(rawNow);
    const cur = { lat: currLat, lon: currLon, time: effNow };

    if (swState === 1) {
        if (courseMode === 'circuit' && lines.lapLine) {
            const canAccumulate = startTriggered;
            if (canAccumulate && lastPos) {
                const stepM = calcDistanceMeters(lastPos.lat, lastPos.lon, cur.lat, cur.lon);
                if (stepM >= 0.5 && stepM < 200) {
                    const prevTotalM = totalDistanceM;
                    const prevTime = lastPos.time;
                    totalDistanceM += stepM;

                    if (rawSpeedMps !== null && rawSpeedMps > 0) {
                        currentSpeedKmh = rawSpeedMps * 3.6;
                    } else {
                        const dtSec = Math.max(0.05, (cur.time - prevTime) / 1000);
                        currentSpeedKmh = (stepM / dtSec) * 3.6;
                    }
                    if (currentSpeedKmh > maxSpeedInLap) {
                        maxSpeedInLap = Math.round(currentSpeedKmh);
                    }

                    let validEle = (typeof rawAltitudeM === 'number' && !isNaN(rawAltitudeM))
                        ? rawAltitudeM
                        : null;
                    if (validEle !== null && lastAltitudeM !== null && Math.abs(validEle - lastAltitudeM) > 50) {
                        validEle = lastAltitudeM;
                    }
                    if (validEle !== null) {
                        lastAltitudeM = validEle;
                    }

                    currentLapPoints.push({
                        lat: cur.lat,
                        lon: cur.lon,
                        ele: validEle,
                        time: new Date(cur.time).toISOString(),
                        speed: currentSpeedKmh,
                        distM: Math.round(totalDistanceM)
                    });

                    if (lapIntervalM > 0) {
                        while (totalDistanceM >= nextLapDistanceM) {
                            const ratio = Math.max(0, Math.min(1, (nextLapDistanceM - prevTotalM) / stepM));
                            const interpTime = prevTime + (cur.time - prevTime) * ratio;
                            const segDist = Math.max(1, Math.round(totalDistanceM - distanceBaseM));
                            recordDistanceSegmentLap(interpTime, nextLapDistanceM, segDist, false);
                            nextLapDistanceM += lapIntervalM;
                        }
                    }
                }
            }

            if (lastPos && canAccumulate && hasAnySectorLine) {
                SECTOR_KEYS.forEach((key, idx) => {
                    const sLine = lines.sectors[key];
                    if (sLine && !triggeredSectors[key]) {
                        const hitSec = getIntersection(lastPos, cur, sLine);
                        const sinceStartOk = (hitSec && (hitSec.time - (startLineCrossTime || startTime) > sectorCooldownMs));
                        const sinceLastSecOk = (hitSec && (hitSec.time - lastSectorCrossTime > sectorCooldownMs));
                        if (sinceStartOk && sinceLastSecOk) {
                            triggeredSectors[key] = true;
                            const secSegDist = Math.max(0, Math.round(totalDistanceM - lastSectorCrossDistM));
                            recordCustomSectorLap(hitSec.time, Math.round(totalDistanceM), secSegDist, `S${idx + 1}(L${circuitLapCounter + 1})`);
                        }
                    }
                });
            }

            if (lastPos) {
                const hitLap = getIntersection(lastPos, cur, lines.lapLine);
                if (hitLap) {
                    if (!startTriggered) {
                        if (hitLap.time - startTime > startCooldownMs) {
                            validStartDirection = hitLap.dir;
                            startTriggered = true;
                            startLineCrossTime = hitLap.time;
                            currentLapStartTime = hitLap.time;
                            lastLapCrossTime = hitLap.time;
                            lastDistanceLapTime = hitLap.time;
                            lastSectorCrossTime = hitLap.time;
                            lastSectorCrossDistM = 0;
                            totalDistanceM = 0;
                            distanceBaseM = 0;
                            nextLapDistanceM = lapIntervalM > 0 ? lapIntervalM : 0;
                            triggeredSectors = {};
                            turnTriggered = false;
                            seqSectorCounter = 0;
                        }
                    } else if (hitLap.dir === validStartDirection && (hitLap.time - lastLapCrossTime > lapCooldownMs)) {
                        const segDist = Math.max(0, Math.round(totalDistanceM - lastSectorCrossDistM));
                        recordCircuitLap(hitLap.time, Math.round(totalDistanceM), segDist);
                        lastLapCrossTime = hitLap.time;

                        if (targetCircuitLaps > 0 && circuitLapCounter >= targetCircuitLaps) {
                            swState = 2;
                            resetPauseButtonUI();
                            document.getElementById('startBtn').classList.remove('active');
                            document.getElementById('gpxBtn').style.display = 'block';
                        }
                    }
                }
            }
        } else {
            if (lines.startLine && lastPos && !startTriggered) {
                const hitStart = getIntersection(lastPos, cur, lines.startLine);
                if (hitStart && (hitStart.time - startTime > startCooldownMs)) {
                    if (validStartDirection === null) validStartDirection = hitStart.dir;
                    if (hitStart.dir === validStartDirection) {
                        startTriggered = true;
                        startLineCrossTime = hitStart.time;
                        currentLapStartTime = hitStart.time;
                        lastDistanceLapTime = hitStart.time;
                        lastSectorCrossTime = hitStart.time;
                        lastSectorCrossDistM = 0;
                        totalDistanceM = 0;
                        distanceBaseM = 0;
                        nextLapDistanceM = lapIntervalM > 0 ? lapIntervalM : 0;
                    }
                }
            }

            const canAccumulate = !lines.startLine || startTriggered;
            if (canAccumulate && lastPos) {
                const stepM = calcDistanceMeters(lastPos.lat, lastPos.lon, cur.lat, cur.lon);
                if (stepM >= 0.5 && stepM < 200) {
                    const prevTotalM = totalDistanceM;
                    const prevTime = lastPos.time;
                    totalDistanceM += stepM;

                    if (rawSpeedMps !== null && rawSpeedMps > 0) {
                        currentSpeedKmh = rawSpeedMps * 3.6;
                    } else {
                        const dtSec = Math.max(0.05, (cur.time - prevTime) / 1000);
                        currentSpeedKmh = (stepM / dtSec) * 3.6;
                    }
                    if (currentSpeedKmh > maxSpeedInLap) {
                        maxSpeedInLap = Math.round(currentSpeedKmh);
                    }

                    let validEle = (typeof rawAltitudeM === 'number' && !isNaN(rawAltitudeM))
                        ? rawAltitudeM
                        : null;

                    if (validEle !== null && lastAltitudeM !== null && Math.abs(validEle - lastAltitudeM) > 50) {
                        validEle = lastAltitudeM;
                    }
                    if (validEle !== null) {
                        lastAltitudeM = validEle;
                    }

                    currentLapPoints.push({
                        lat: cur.lat,
                        lon: cur.lon,
                        ele: validEle,
                        time: new Date(cur.time).toISOString(),
                        speed: currentSpeedKmh,
                        distM: Math.round(totalDistanceM)
                    });

                    if (lapIntervalM > 0) {
                        while (totalDistanceM >= nextLapDistanceM) {
                            const ratio = Math.max(0, Math.min(1, (nextLapDistanceM - prevTotalM) / stepM));
                            const interpTime = prevTime + (cur.time - prevTime) * ratio;
                            const segDist = Math.max(1, Math.round(totalDistanceM - distanceBaseM));
                            recordDistanceSegmentLap(interpTime, nextLapDistanceM, segDist, false);
                            nextLapDistanceM += lapIntervalM;
                        }
                    }
                }
            }

            if (lastPos && canAccumulate) {
                if (lines.turnLine && !turnTriggered) {
                    const hitTurn = getIntersection(lastPos, cur, lines.turnLine);
                    const sinceStartOk = (hitTurn && (hitTurn.time - (startLineCrossTime || startTime) > sectorCooldownMs));
                    const sinceLastSecOk = (hitTurn && (hitTurn.time - lastSectorCrossTime > sectorCooldownMs));
                    if (sinceStartOk && sinceLastSecOk) {
                        turnTriggered = true;
                        const turnSegDist = Math.max(0, Math.round(totalDistanceM - lastSectorCrossDistM));
                        const labelName = lines.turnLine ? `S${++seqSectorCounter}` : 'TURN';
                        recordCustomSectorLap(hitTurn.time, Math.round(totalDistanceM), turnSegDist, labelName);
                    }
                }

                if (hasAnySectorLine) {
                    SECTOR_KEYS.forEach((key, idx) => {
                        const sLine = lines.sectors[key];
                        if (sLine && !triggeredSectors[key]) {
                            const hitSec = getIntersection(lastPos, cur, sLine);
                            const sinceStartOk = (hitSec && (hitSec.time - (startLineCrossTime || startTime) > sectorCooldownMs));
                            const sinceLastSecOk = (hitSec && (hitSec.time - lastSectorCrossTime > sectorCooldownMs));
                            if (sinceStartOk && sinceLastSecOk) {
                                triggeredSectors[key] = true;
                                const secSegDist = Math.max(0, Math.round(totalDistanceM - lastSectorCrossDistM));
                                const labelName = lines.turnLine ? `S${++seqSectorCounter}` : `S${idx + 1}`;
                                recordCustomSectorLap(hitSec.time, Math.round(totalDistanceM), secSegDist, labelName);
                            }
                        }
                    });
                }
            }

            if (lines.goalLine && lastPos && canAccumulate) {
                const hitGoal = getIntersection(lastPos, cur, lines.goalLine);
                if (hitGoal) {
                    const segDist = Math.max(0, Math.round(totalDistanceM - lastSectorCrossDistM));
                    recordCustomSectorLap(hitGoal.time, Math.round(totalDistanceM), segDist, 'GOAL');
                    swState = 2;
                    resetPauseButtonUI();
                    document.getElementById('startBtn').classList.remove('active');
                    document.getElementById('gpxBtn').style.display = 'block';
                }
            }
        }
    }

    lastPos = cur;
}

document.getElementById('intGpsBtn').onclick = function() {
    const btn = this;
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active');
        btn.style.backgroundColor = "#f2f2f2";
        btn.style.color = "#000";
    } else {
        if (!navigator.geolocation) {
            alert("この端末では内部GPSが利用できません。");
            return;
        }
        btn.style.backgroundColor = "var(--hrc-orange)";
        btn.style.color = "#fff";

        watchId = navigator.geolocation.watchPosition(p => {
            btn.style.backgroundColor = "var(--hrc-red)";
            btn.style.color = "#fff";
            btn.classList.add('active');

            const rawSpd = (typeof p.coords.speed === 'number' && !isNaN(p.coords.speed)) ? p.coords.speed : null;
            if (rawSpd !== null) currentSpeedKmh = rawSpd * 3.6;

            const rawAlt = (typeof p.coords.altitude === 'number' && !isNaN(p.coords.altitude))
                ? p.coords.altitude
                : null;

            handlePositionUpdate(
                p.coords.latitude,
                p.coords.longitude,
                Date.now(),
                p.coords.accuracy,
                rawSpd,
                rawAlt
            );
        }, err => {
            console.warn("GPS取得エラー:", err);
        }, { enableHighAccuracy: true, maximumAge: 500, timeout: 10000 });
    }
};

function timeFormat(ms) {
    const safeMs = Math.max(0, ms);
    const m = Math.floor(safeMs / 60000);
    const s = Math.floor((safeMs % 60000) / 1000);
    const ms2 = Math.floor(safeMs % 1000);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms2.toString().padStart(3, '0')}`;
}

function mainLoop() {
    const rawNow = Date.now();
    if (swState === 1 || swState === 3) {
        const effNow = getEffectiveTime(rawNow);
        const pauseTag = (swState === 3) ? " [PAUSE]" : "";
        document.getElementById('display').textContent = "TOTAL " + timeFormat(effNow - startTime) + pauseTag;

        const stLapEl = document.getElementById('stline-lap');
        const hasStartLine = (courseMode === 'circuit') ? Boolean(lines.lapLine) : Boolean(lines.startLine);
        if (hasStartLine) {
            if (startTriggered && startLineCrossTime !== null) {
                stLapEl.textContent = timeFormat(effNow - startLineCrossTime);
            } else {
                stLapEl.textContent = "00:00.000";
            }
        } else {
            stLapEl.textContent = timeFormat(effNow - startTime);
        }

        const d1 = document.getElementById('display1');
        if (swState === 3) {
            d1.textContent = timeFormat(effNow - (currentLapStartTime || startTime));
            d1.style.color = "var(--hrc-orange)";
        } else if (isFrozen && rawNow < freezeUntil) {
            d1.textContent = freezeDisplayTime;
            d1.style.color = "#000";
        } else {
            d1.textContent = timeFormat(effNow - (currentLapStartTime || startTime));
            d1.style.color = "#000";
            isFrozen = false;
        }
    }
    const secDistM = getCurrentSectorDistM();
    document.getElementById('speed_val').textContent = (swState === 3) ? 0 : Math.round(currentSpeedKmh);
    document.getElementById('max_speed_val').textContent = maxSpeedInLap;
    document.getElementById('sec_dist_val').textContent = `${secDistM}m`;
    document.getElementById('dist_val').textContent = `${Math.round(totalDistanceM)}m`;
    requestAnimationFrame(mainLoop);
}

document.getElementById('startBtn').onclick = function() {
    if (swState === 0 || swState === 2) {
        loadAllCourseLines();
        courseMode = localStorage.getItem('klap_course_mode') || 'marathon';
        targetCircuitLaps = Math.max(0, Math.floor(Number(localStorage.getItem('klap_circuit_laps')) || 0));
        const rawInterval = Number(localStorage.getItem('marathon_lap_interval_m'));
        lapIntervalM = (!isNaN(rawInterval) && rawInterval > 0) ? rawInterval : 0;

        document.getElementById('debug-intv').textContent = lapIntervalM;
        document.getElementById('debug-laps').textContent = targetCircuitLaps > 0 ? targetCircuitLaps : '∞';

        swState = 1;
        startTime = Date.now();
        pauseStartTime = 0;
        pausedAccumulatedMs = 0;
        startLineCrossTime = null;
        lastLapCrossTime = 0;
        currentLapStartTime = startTime;
        lastDistanceLapTime = startTime;
        lastSectorCrossTime = startTime;
        lastSectorCrossDistM = 0;
        triggeredSectors = {};
        turnTriggered = false;
        seqSectorCounter = 0;
        lapRecords = [];
        distLapCounter = 0;
        circuitLapCounter = 0;
        totalDistanceM = 0;
        distanceBaseM = 0;
        nextLapDistanceM = lapIntervalM > 0 ? lapIntervalM : 0;
        maxSpeedInLap = 0;
        currentLapPoints = [];
        lastAltitudeM = null;
        validStartDirection = null;
        startTriggered = (courseMode === 'circuit') ? !lines.lapLine : !lines.startLine;
        lastPos = null;

        trackLatLngs = [];
        if (trackPolyline) trackPolyline.setLatLngs([]);

        resetPauseButtonUI();
        this.classList.add('active');
        document.getElementById('gpxBtn').style.display = 'none';
        document.getElementById('lap').innerHTML = '';
        document.getElementById('best-display').innerHTML = `<span class="best-label">BEST LAP</span>00:00.000`;
        document.getElementById('stline-lap').textContent = "00:00.000";
        document.getElementById('display1').style.color = "#000";
    } else {
        if (swState === 3 && pauseStartTime > 0) {
            pausedAccumulatedMs += Math.max(0, Date.now() - pauseStartTime);
            pauseStartTime = 0;
        }
        swState = 2;
        resetPauseButtonUI();
        this.classList.remove('active');
        document.getElementById('display1').style.color = "#000";
        document.getElementById('gpxBtn').style.display = 'block';
    }
};

document.getElementById('pauseBtn').onclick = function() {
    if (swState === 1) {
        swState = 3;
        pauseStartTime = Date.now();
        isFrozen = false;
        lastPos = null;
        this.textContent = 'RESUME';
        this.classList.add('paused');
    } else if (swState === 3) {
        if (pauseStartTime > 0) {
            pausedAccumulatedMs += Math.max(0, Date.now() - pauseStartTime);
            pauseStartTime = 0;
        }
        swState = 1;
        lastPos = null;
        this.textContent = 'PAUSE';
        this.classList.remove('paused');
        document.getElementById('display1').style.color = "#000";
    }
};

document.getElementById('lapBtn').onclick = () => {
    if (swState === 1) {
        const effNow = getEffectiveTime(Date.now());
        const segDist = Math.max(0, Math.round(totalDistanceM - distanceBaseM));
        recordDistanceSegmentLap(effNow, Math.round(totalDistanceM), segDist, true);
    }
};

document.getElementById('historyBtn').onclick = () => {
    if (lapRecords.length === 0) {
        alert("ラップ履歴がありません");
        return;
    }
    const lapOnly = lapRecords.filter(r => r.kind === 'circuit' || r.kind === 'distance');
    const bT = lapOnly.length > 0
        ? Math.min(...lapOnly.map(r => r.lapMs))
        : Math.min(...lapRecords.map(r => r.lapMs));

    document.getElementById('history-body').innerHTML = lapRecords.map(r => {
        const isSector = (r.kind === 'sector');
        const isBest = (!isSector && r.lapMs === bT);
        const timeStyle = isBest ? 'color:var(--hrc-red);' : '';
        const tagStyle = isSector ? 'color:#00838f;' : '';
        const secDistDisplay = `${Math.max(0, Math.round(r.segDistanceM || 0))}m`;
        return `
        <tr>
            <td style="${tagStyle}">${r.label}</td>
            <td>${secDistDisplay}</td>
            <td>${timeFormat(r.splitMs)}</td>
            <td style="${timeStyle}">${timeFormat(r.lapMs)}</td>
            <td>${formatPace(r.paceSecPerKm)}</td>
            <td style="color:var(--hrc-orange);">${r.max}</td>
        </tr>`;
    }).join('');
    document.getElementById('history-page').style.display = 'block';
};

document.getElementById('gpxBtn').onclick = async function() {
    if (lapRecords.length === 0) {
        alert("保存するデータがありません");
        return;
    }

    let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="KLAP_MARATHON_GPS" xmlns="http://www.topografix.com/GPX/1/1">
<metadata>
    <desc>LAP_INTERVAL_M:${lapIntervalM};CIRCUIT_LAPS:${targetCircuitLaps}</desc>
</metadata>
<trk><name>KLAP_MARATHON_${new Date().getTime()}</name>
<trkseg>`;

    [...lapRecords].reverse().forEach(lap => {
        if (lap.points && lap.points.length > 0) {
            lap.points.forEach(p => {
                const eleTag = (typeof p.ele === 'number' && !isNaN(p.ele))
                    ? `\n<ele>${p.ele.toFixed(1)}</ele>`
                    : '';

                gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}">${eleTag}
<time>${p.time}</time>
<extensions><speed>${(p.speed / 3.6).toFixed(2)}</speed></extensions>
</trkpt>`;
            });
        }
    });

    gpx += `\n</trkseg>\n</trk>`;

    if (lines.startLine) {
        gpx += `\n<trk><name>START_LINE</name><trkseg>
<trkpt lat="${lines.startLine.p1.lat}" lon="${lines.startLine.p1.lon}"></trkpt>
<trkpt lat="${lines.startLine.p2.lat}" lon="${lines.startLine.p2.lon}"></trkpt>
</trkseg></trk>`;
    }

    if (lines.goalLine) {
        gpx += `\n<trk><name>GOAL_LINE</name><trkseg>
<trkpt lat="${lines.goalLine.p1.lat}" lon="${lines.goalLine.p1.lon}"></trkpt>
<trkpt lat="${lines.goalLine.p2.lat}" lon="${lines.goalLine.p2.lon}"></trkpt>
</trkseg></trk>`;
    }

    if (lines.turnLine) {
        gpx += `\n<trk><name>TURN_LINE</name><trkseg>
<trkpt lat="${lines.turnLine.p1.lat}" lon="${lines.turnLine.p1.lon}"></trkpt>
<trkpt lat="${lines.turnLine.p2.lat}" lon="${lines.turnLine.p2.lon}"></trkpt>
</trkseg></trk>`;
    }

    if (lines.lapLine) {
        gpx += `\n<trk><name>LAP_LINE</name><trkseg>
<trkpt lat="${lines.lapLine.p1.lat}" lon="${lines.lapLine.p1.lon}"></trkpt>
<trkpt lat="${lines.lapLine.p2.lat}" lon="${lines.lapLine.p2.lon}"></trkpt>
</trkseg></trk>`;
    }

    SECTOR_KEYS.forEach((key, idx) => {
        const sLine = lines.sectors[key];
        if (sLine) {
            gpx += `\n<trk><name>SEC${idx + 1}_LINE</name><trkseg>
<trkpt lat="${sLine.p1.lat}" lon="${sLine.p1.lon}"></trkpt>
<trkpt lat="${sLine.p2.lat}" lon="${sLine.p2.lon}"></trkpt>
</trkseg></trk>`;
        }
    });

    gpx += `\n</gpx>`;

    const filename = `klap_marathon_${new Date().getTime()}.gpx`;
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const file = new File([blob], filename, { type: 'application/gpx+xml' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({
                files: [file],
                title: 'KLAP Marathon GPX',
                text: `距離ラップ間隔: ${lapIntervalM}m`
            });
        } catch (err) {
            if (err.name !== 'AbortError') downloadFallback(blob, filename);
        }
    } else {
        downloadFallback(blob, filename);
    }
};

function downloadFallback(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

window.addEventListener('resize', syncMapAspectRatio);
window.addEventListener('orientationchange', () => setTimeout(syncMapAspectRatio, 200));

function readStoredLine(key) {
    const p1Lat = parseFloat(localStorage.getItem(key + 'P1Lat'));
    const p1Lon = parseFloat(localStorage.getItem(key + 'P1Lon'));
    const p2Lat = parseFloat(localStorage.getItem(key + 'P2Lat'));
    const p2Lon = parseFloat(localStorage.getItem(key + 'P2Lon'));
    if (!isNaN(p1Lat) && !isNaN(p1Lon) && !isNaN(p2Lat) && !isNaN(p2Lon)) {
        return { p1: { lat: p1Lat, lon: p1Lon }, p2: { lat: p2Lat, lon: p2Lon } };
    }
    return null;
}

function cloneLine(line) {
    if (!line) return null;
    return {
        p1: { lat: line.p1.lat, lon: line.p1.lon },
        p2: { lat: line.p2.lat, lon: line.p2.lon }
    };
}

function loadAllCourseLines() {
    ['startLine', 'goalLine', 'turnLine', 'lapLine'].forEach(key => {
        lines[key] = readStoredLine(key);
    });
    SECTOR_KEYS.forEach(key => {
        lines.sectors[key] = readStoredLine(key);
    });

    if (lines.turnLine) {
        if (!lines.goalLine && lines.startLine) {
            lines.goalLine = cloneLine(lines.startLine);
        }
        const forwardIndices = [1, 2, 3, 4].filter(n => Boolean(lines.sectors[`sec${n}Line`]));
        const reversed = [...forwardIndices].reverse();
        reversed.forEach((srcNum, idx) => {
            const dstNum = 5 + idx;
            const dstKey = `sec${dstNum}Line`;
            if (dstNum <= 10 && !lines.sectors[dstKey]) {
                lines.sectors[dstKey] = cloneLine(lines.sectors[`sec${srcNum}Line`]);
            }
        });
    }

    hasAnySectorLine = SECTOR_KEYS.some(key => Boolean(lines.sectors[key]));
}

window.onload = () => {
    courseMode = localStorage.getItem('klap_course_mode') || 'marathon';
    targetCircuitLaps = Math.max(0, Math.floor(Number(localStorage.getItem('klap_circuit_laps')) || 0));
    const rawInterval = Number(localStorage.getItem('marathon_lap_interval_m'));
    lapIntervalM = (!isNaN(rawInterval) && rawInterval > 0) ? rawInterval : 0;

    document.getElementById('debug-intv').textContent = lapIntervalM;
    document.getElementById('debug-laps').textContent = targetCircuitLaps > 0 ? targetCircuitLaps : '∞';

    loadAllCourseLines();
    initMap();
    mainLoop();
};

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Register Failed!', err));
    });
}
</script>
