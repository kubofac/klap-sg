<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP MARATHON ANALYZER</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --hrc-purple: #e040fb; --hrc-orange: #ff9900; --hrc-yellow: #ffff00; --hrc-green: #33ff77; --hrc-cyan: #00e5ff; }
        html, body { overflow: hidden; width: 100%; height: 100%; background: #000; margin: 0; padding: 0; font-family: sans-serif; color: #fff; position: fixed; touch-action: none; }
        #main-container { display: flex; height: calc(100vh - 105px); width: 100%; }
        #map { width: 35%; height: 100%; border-right: 1px solid #444; background: #111; position: relative; z-index: 1; }
        #chart-area { width: 65%; height: 100%; background: #000; position: relative; z-index: 1; }

        #data-dashboard {
            position: fixed;
            z-index: 9999;
            
            background: rgba(0,0,0,0.88);
            border-radius: 8px;
            border: 2px solid #666;
            min-width: 155px;
            touch-action: none;
            top: 20px;
            right: 20px;
        }
        .panel-header {
            background: #333;
            color: #fff;
            font-size: 11px;
            padding: 8px 10px;
            text-align: center;
            cursor: move;
            border-radius: 6px 6px 0 0;
            user-select: none;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }

        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 11px; pointer-events: none; }
        .dash-grid { display: grid; grid-template-columns: 54px 1fr; gap: 8px; text-align: right; margin-bottom: 5px; align-items: center; }
        .grid-label { text-align: left; color: #888; }

        #map-adjust-ctrls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(3, 35px);
            grid-template-rows: repeat(2, 35px);
            gap: 2px;
            padding-top: env(safe-area-inset-top);
        }

        .adj-btn {
            width: 35px;
            height: 35px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .sector-pin-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--hrc-yellow);
            border: 1px solid var(--hrc-yellow);
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 10px;
            font-weight: bold;
            box-shadow: none;
        }
        .custom-sector-label {
            background: rgba(0, 20, 28, 0.9);
            color: var(--hrc-cyan);
            border: 1px solid var(--hrc-cyan);
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 10px;
            font-weight: bold;
            box-shadow: none;
        }
        .leaflet-tooltip.sector-pin-label::before,
        .leaflet-tooltip.custom-sector-label::before { display: none; }

        #lap-list-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .mode-tabs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }
        .mode-tab-btn {
            flex: 1;
            max-width: 180px;
            padding: 7px 6px;
            background: #1c1c1c;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .mode-tab-btn.active {
            background: var(--hrc-blue);
            color: #000;
            border-color: var(--hrc-blue);
        }
        .mode-tab-btn.active-sec {
            background: var(--hrc-cyan);
            color: #000;
            border-color: var(--hrc-cyan);
        }
        .mode-tab-btn.active-lap {
            background: var(--hrc-purple);
            color: #fff;
            border-color: var(--hrc-purple);
        }

        .total-run-banner {
            background: #1a1a1a;
            border: 1px solid var(--hrc-yellow);
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .total-run-time {
            color: var(--hrc-yellow);
            font-weight: bold;
            font-size: 16px;
            font-family: 'Courier New', monospace;
        }
        .sector-summary-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0 10px;
            font-size: 12px;
        }
        .summary-card {
            background: #141414;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
        }
        .summary-card.best-card { border-color: var(--hrc-red); }
        .summary-card.slow-card { border-color: var(--hrc-blue); }

        #lap-list-content { flex: 1; overflow-y: auto; border-top: 1px solid #333; }
        .lap-row { display: grid; grid-template-columns: 76px 66px 76px 76px 72px 46px 72px 76px; gap: 4px; padding: 10px 4px; border-bottom: 1px solid #222; cursor: pointer; text-align: center; font-size: 11px; color: #fff; align-items: center; }
        .list-header { font-weight: bold; color: #aaa; background: #161616; cursor: default; position: sticky; top: 0; z-index: 2; }
        .lap-row.row-best { background: rgba(255, 68, 68, 0.14); }
        .lap-row.row-slow { background: rgba(51, 204, 255, 0.14); }

        .lap-best { color: var(--hrc-red) !important; font-weight: bold; }
        .lap-slow { color: var(--hrc-blue) !important; font-weight: bold; }
        .stat-best { background: var(--hrc-orange); color: #000 !important; font-weight: bold; border-radius: 2px; }

        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #111; z-index: 999; padding: 5px; box-sizing: border-box; }
        .ctrl-row { display: flex; align-items: center; gap: 5px; height: 45px; overflow-x: auto; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 11px; height: 35px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        #seek-bar {
            width: 100%;
            height: 44px;
            accent-color: var(--hrc-red);
            cursor: pointer;
            touch-action: pan-x;
        }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map">
        <div id="map-adjust-ctrls">
            <button class="adj-btn" style="grid-column: 2; grid-row: 1;" onclick="adjustMap(0.00001, 0)">↑</button>
            <button class="adj-btn" style="grid-column: 1; grid-row: 2;" onclick="adjustMap(0, -0.00001)">←</button>
            <button class="adj-btn" style="grid-column: 2; grid-row: 2;" onclick="adjustMap(-0.00001, 0)">↓</button>
            <button class="adj-btn" style="grid-column: 3; grid-row: 2;" onclick="adjustMap(0, 0.00001)">→</button>
        </div>
    </div>
    <div id="chart-area">
        <div id="data-dashboard">
            <div class="panel-header" id="dash-handle">✜ DRAG HERE</div>
            <div id="dash-content">
                <div class="dash-grid"><span class="grid-label">TIME</span><span id="p-time">0:00.00</span></div>
                <div class="dash-grid"><span class="grid-label">SPD</span><span id="p-spd">0</span></div>
                <div class="dash-grid"><span class="grid-label">ELEV</span><span id="p-ele">0.0m</span></div>
                <div class="dash-grid"><span class="grid-label">DIST</span><span id="p-dist">0m</span></div>
                <hr style="border:0; border-top:1px solid #333;">
                <div class="dash-grid" style="color:var(--hrc-yellow)"><span class="grid-label">A-B</span><span id="p-ab">-</span></div>
            </div>
        </div>
        <div style="height:100%; width:100%;"><canvas id="mainChart"></canvas></div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">OPEN GPX</button>
        <button class="mini-btn" id="openListBtn" style="background:var(--hrc-blue)">LAP LIST</button>
        <button class="mini-btn" id="btnSetA" style="background:var(--hrc-yellow); color:#000">SET A</button>
        <button class="mini-btn" id="btnSetB" style="background:var(--hrc-yellow); color:#000">SET B</button>
        <button class="mini-btn" onclick="location.reload()">RESET</button>
    </div>
    <input type="range" id="seek-bar" value="0">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<div id="lap-list-overlay">
    <h3 id="overlay-title" style="text-align:center; color:#fff; margin:0;">DISTANCE SECTORS (START → GOAL)</h3>
    <div class="mode-tabs">
        <button class="mode-tab-btn active" id="tab-dist" onclick="switchAnalysisMode('dist')">距離セクター</button>
        <button class="mode-tab-btn" id="tab-sector" onclick="switchAnalysisMode('sector')">任意セクター</button>
        <button class="mode-tab-btn" id="tab-circuit" onclick="switchAnalysisMode('circuit')">周回ラップ</button>
    </div>
    <div class="total-run-banner">
        <div>
            <span style="color:#aaa; font-size:11px;">START → GOAL TOTAL TIME</span><br>
            <span class="total-run-time" id="start-goal-time">-</span>
        </div>
        <div id="start-goal-meta" style="color:#ccc; font-size:12px; text-align:right;">-</div>
    </div>
    <div class="sector-summary-bar">
        <div class="summary-card best-card">
            <div style="color:var(--hrc-red); font-weight:bold;">BEST</div>
            <div id="best-sector-summary" style="margin-top:3px;">-</div>
        </div>
        <div class="summary-card slow-card">
            <div style="color:var(--hrc-blue); font-weight:bold;">SLOWEST</div>
            <div id="slow-sector-summary" style="margin-top:3px;">-</div>
        </div>
    </div>
    <div id="lap-list-content"></div>
    <button class="mini-btn" style="margin-top:12px; width:100%; height:48px; background:var(--hrc-blue); font-size:15px;" onclick="closeLapList()">CLOSE</button>
</div>

<script>
'use strict';
let map, markerP, mainChart, fullRunData = null;
let distanceSectors = [];
let customSectors = [];
let circuitLaps = [];
let analysisMode = 'dist'; // 'dist' | 'sector' | 'circuit'

let currentFrame = 0, isPlaying = false, idxA = null, idxB = null;
let latOffset = 0, lonOffset = 0;
let gpxLapIntervalM = 1000;
const SECTOR_KEYS = Array.from({ length: 10 }, (_, i) => `sec${i + 1}Line`);
let gpxLines = { startLine: null, goalLine: null, lapLine: null, sectors: {} };
const SMOOTH_HALF_WINDOW = 4; // 前後4点（計9点）移動平均で速度・標高を平滑化

window.onload = () => {
    map = L.map('map', {
        zoomControl: false,
        maxZoom: 24,
        attributionControl: false
    }).setView([35.68, 139.76], 15);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 24,
        maxNativeZoom: 18
    }).addTo(map);

    L.control.attribution({ prefix: 'Esri' }).addTo(map);

    markerP = L.circleMarker([0, 0], { color: '#33ccff', fillColor: '#000', radius: 7, fillOpacity: 1, weight: 3 }).addTo(map);
    makeDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));

    const seekBar = document.getElementById('seek-bar');
    const handleLinearSeek = (e) => {
        if (isPlaying) {
            isPlaying = false;
            document.getElementById('playBtn').innerText = "PLAY";
        }
        currentFrame = parseInt(e.target.value, 10) || 0;
        updateFrame();
    };
    seekBar.addEventListener('input', handleLinearSeek);
    seekBar.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });
    seekBar.addEventListener('touchmove', (e) => { e.stopPropagation(); }, { passive: true });
};

function makeDraggable(el, handle) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    handle.onmousedown = dragStart;
    handle.ontouchstart = dragStart;

    function dragStart(e) {
        e = e || window.event;
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        el.style.right = 'auto';
        el.style.left = rect.left + 'px';
        el.style.top = rect.top + 'px';

        pos3 = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        pos4 = e.clientY || (e.touches ? e.touches[0].clientY : 0);

        document.onmouseup = dragEnd;
        document.ontouchend = dragEnd;
        document.onmousemove = dragMove;
        document.ontouchmove = dragMove;
    }

    function dragMove(e) {
        let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        let cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        pos1 = pos3 - cx;
        pos2 = pos4 - cy;
        pos3 = cx;
        pos4 = cy;
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
    }

    function dragEnd() {
        document.onmouseup = null;
        document.onmousemove = null;
        document.ontouchend = null;
        document.ontouchmove = null;
    }
}

function adjustMap(dLat, dLon) { latOffset += dLat; lonOffset += dLon; updateUI(); }

document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
        fullRunData = null;
        distanceSectors = [];
        customSectors = [];
        circuitLaps = [];
        gpxLines = { startLine: null, goalLine: null, lapLine: null, sectors: {} };
        window.isMapInit = false;
        currentFrame = 0;
        idxA = null;
        idxB = null;
        isPlaying = false;
        document.getElementById('playBtn').innerText = "PLAY";

        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");
        parseMarathonMeta(xml);
        processFullRunGPX(xml);

        if (circuitLaps.length > 0 && gpxLines.lapLine) {
            analysisMode = 'circuit';
        } else if (customSectors.length > 0) {
            analysisMode = 'sector';
        } else {
            analysisMode = 'dist';
        }
        updateModeTabs();
        renderSectorList();
        updateUI();
        document.getElementById('lap-list-overlay').style.display = 'flex';
    };
    reader.readAsText(file);
};

function switchAnalysisMode(mode) {
    analysisMode = mode;
    updateModeTabs();
    renderSectorList();
    updateUI();
}

function updateModeTabs() {
    const tDist = document.getElementById('tab-dist');
    const tSec = document.getElementById('tab-sector');
    const tLap = document.getElementById('tab-circuit');
    const titleEl = document.getElementById('overlay-title');

    tDist.className = 'mode-tab-btn' + (analysisMode === 'dist' ? ' active' : '');
    tSec.className = 'mode-tab-btn' + (analysisMode === 'sector' ? ' active-sec' : '');
    tLap.className = 'mode-tab-btn' + (analysisMode === 'circuit' ? ' active-lap' : '');

    tDist.textContent = `距離セクター (${distanceSectors.length})`;
    tSec.textContent = `任意セクター (${customSectors.length})`;
    tLap.textContent = `周回ラップ (${circuitLaps.length})`;

    if (analysisMode === 'circuit') {
        titleEl.textContent = 'CIRCUIT LAPS (LAP LINE)';
    } else if (analysisMode === 'sector') {
        titleEl.textContent = 'CUSTOM SECTORS (SEC 1 - 10)';
    } else {
        titleEl.textContent = 'DISTANCE SECTORS (START → GOAL)';
    }
}

function parseMarathonMeta(xml) {
    gpxLapIntervalM = Math.max(1, Number(localStorage.getItem('marathon_lap_interval_m')) || 1000);
    const desc = xml.getElementsByTagName('desc')[0]?.textContent || '';
    const match = desc.match(/LAP_INTERVAL_M:(\d+)/i);
    if (match && Number(match[1]) > 0) {
        gpxLapIntervalM = Number(match[1]);
    }
}

function calcDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getLineIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1[1], y1 = p1[0], x2 = p2[1], y2 = p2[0];
    const x3 = line.p1[1], y3 = line.p1[0], x4 = line.p2[1], y4 = line.p2[0];
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        return {
            t,
            coord: [y1 + (y2 - y1) * t, x1 + (x2 - x1) * t],
            dir: ((x4 - x3) * (y2 - y1) - (y4 - y3) * (x2 - x1)) > 0 ? 1 : -1
        };
    }
    return null;
}

function smoothMovingAverage(values, halfWindow = SMOOTH_HALF_WINDOW) {
    if (!Array.isArray(values) || values.length === 0) return [];
    return values.map((_, idx, arr) => {
        const start = Math.max(0, idx - halfWindow);
        const end = Math.min(arr.length - 1, idx + halfWindow);
        let sum = 0;
        for (let i = start; i <= end; i++) {
            sum += arr[i];
        }
        return sum / (end - start + 1);
    });
}

function formatLapTime(sec) {
    const safeSec = Math.max(0, sec || 0);
    const m = Math.floor(safeSec / 60);
    const s = safeSec % 60;
    return `${m}:${s.toFixed(2).padStart(5, '0')}`;
}

function formatPace(secPerKm) {
    if (!isFinite(secPerKm) || secPerKm <= 0) return "--'--\"";
    const totalSec = Math.round(secPerKm);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m}'${s.toString().padStart(2, '0')}"`;
}

function loadStoredLineFallback(key) {
    const p1Lat = parseFloat(localStorage.getItem(key + 'P1Lat'));
    const p1Lon = parseFloat(localStorage.getItem(key + 'P1Lon'));
    const p2Lat = parseFloat(localStorage.getItem(key + 'P2Lat'));
    const p2Lon = parseFloat(localStorage.getItem(key + 'P2Lon'));
    if (!isNaN(p1Lat) && !isNaN(p1Lon) && !isNaN(p2Lat) && !isNaN(p2Lon)) {
        return { p1: [p1Lat, p1Lon], p2: [p2Lat, p2Lon] };
    }
    return null;
}

function processFullRunGPX(xml) {
    gpxLines = { startLine: null, goalLine: null, lapLine: null, sectors: {} };
    const trks = xml.getElementsByTagName('trk');
    let pts = [];
    let hasLineTrackInGpx = false;

    for (let t = 0; t < trks.length; t++) {
        const nameNode = trks[t].getElementsByTagName('name')[0];
        const trkName = (nameNode ? nameNode.textContent : '').trim().toUpperCase();
        const trkPts = trks[t].getElementsByTagName('trkpt');
        const secMatch = trkName.match(/^SEC(\d+)_LINE$/);

        if (trkName === 'START_LINE' || trkName === 'GOAL_LINE' || trkName === 'LAP_LINE' || secMatch) {
            hasLineTrackInGpx = true;
            if (trkPts.length >= 2) {
                const p1Lat = parseFloat(trkPts[0].getAttribute('lat'));
                const p1Lon = parseFloat(trkPts[0].getAttribute('lon'));
                const p2Lat = parseFloat(trkPts[1].getAttribute('lat'));
                const p2Lon = parseFloat(trkPts[1].getAttribute('lon'));
                if (!isNaN(p1Lat) && !isNaN(p1Lon) && !isNaN(p2Lat) && !isNaN(p2Lon)) {
                    const lineData = { p1: [p1Lat, p1Lon], p2: [p2Lat, p2Lon] };
                    if (trkName === 'START_LINE') gpxLines.startLine = lineData;
                    if (trkName === 'GOAL_LINE') gpxLines.goalLine = lineData;
                    if (trkName === 'LAP_LINE') gpxLines.lapLine = lineData;
                    if (secMatch) {
                        const secNum = parseInt(secMatch[1], 10);
                        if (secNum >= 1 && secNum <= 10) {
                            gpxLines.sectors[`sec${secNum}Line`] = lineData;
                        }
                    }
                }
            }
        } else {
            pts = pts.concat(Array.from(trkPts));
        }
    }

    if (!hasLineTrackInGpx) {
        gpxLines.startLine = loadStoredLineFallback('startLine');
        gpxLines.goalLine = loadStoredLineFallback('goalLine');
        gpxLines.lapLine = loadStoredLineFallback('lapLine');
        SECTOR_KEYS.forEach(k => {
            gpxLines.sectors[k] = loadStoredLineFallback(k);
        });
    }

    if (pts.length === 0) {
        alert("GPXデータが見つかりません。");
        return;
    }

    let firstRawTime = 0;
    let totalDistM = 0;
    let lastValidEle = null;

    const run = {
        coords: [],
        timesSec: [],
        speeds: [],
        elevs: [],
        dists: [],
        totalTimeSec: 0,
        totalDistM: 0
    };

    for (let i = 0; i < pts.length; i++) {
        const lat = parseFloat(pts[i].getAttribute('lat'));
        const lon = parseFloat(pts[i].getAttribute('lon'));
        if (isNaN(lat) || isNaN(lon)) continue;

        const timeStr = pts[i].getElementsByTagName('time')[0]?.textContent;
        const rawTime = timeStr ? new Date(timeStr).getTime() : (firstRawTime + i * 1000);
        if (run.coords.length === 0) firstRawTime = rawTime;
        const elapsedSec = Math.max(0, (rawTime - firstRawTime) / 1000);

        const eleNode = pts[i].getElementsByTagName('ele')[0];
        let eleVal = eleNode ? parseFloat(eleNode.textContent) : NaN;
        if (!isNaN(eleVal) && isFinite(eleVal)) {
            lastValidEle = eleVal;
        } else if (lastValidEle !== null) {
            eleVal = lastValidEle;
        } else {
            eleVal = 0;
        }

        let rawSpeedMps = NaN;
        const ext = pts[i].getElementsByTagName('extensions')[0];
        if (ext) {
            const spNode = ext.getElementsByTagName('speed')[0];
            if (spNode) rawSpeedMps = parseFloat(spNode.textContent);
        }

        let spdKmh = 0;
        if (run.coords.length > 0) {
            const prevIdx = run.coords.length - 1;
            const prevCoord = run.coords[prevIdx];
            const prevTimeSec = run.timesSec[prevIdx];
            const stepM = calcDistanceMeters(prevCoord[0], prevCoord[1], lat, lon);

            if (stepM >= 0.3 && stepM < 200) {
                totalDistM += stepM;
            }
            if (!isNaN(rawSpeedMps) && rawSpeedMps >= 0) {
                spdKmh = rawSpeedMps * 3.6;
            } else {
                const dtSec = Math.max(0.05, elapsedSec - prevTimeSec);
                spdKmh = (stepM / dtSec) * 3.6;
            }
        } else {
            spdKmh = (!isNaN(rawSpeedMps) && rawSpeedMps >= 0) ? rawSpeedMps * 3.6 : 0;
        }

        run.coords.push([lat, lon]);
        run.timesSec.push(elapsedSec);
        run.speeds.push(spdKmh);
        run.elevs.push(eleVal);
        run.dists.push(totalDistM);
    }

    if (run.coords.length === 0) return;

    run.speeds = smoothMovingAverage(run.speeds, SMOOTH_HALF_WINDOW);
    run.elevs = smoothMovingAverage(run.elevs, SMOOTH_HALF_WINDOW);
    run.totalTimeSec = run.timesSec[run.timesSec.length - 1];
    run.totalDistM = run.dists[run.dists.length - 1];
    fullRunData = run;

    buildDistanceSectors(run);
    buildCustomSectors(run);
    buildCircuitLaps(run);
}

// 1. 距離セクター算出
function buildDistanceSectors(run) {
    distanceSectors = [];
    let lapNo = 1;
    let nextTargetDistM = gpxLapIntervalM;
    let segStartIdx = 0;
    let segStartTimeSec = 0;
    let segStartDistM = 0;

    for (let i = 1; i < run.coords.length; i++) {
        const prevDist = run.dists[i - 1];
        const curDist = run.dists[i];
        const segStep = curDist - prevDist;

        while (segStep > 0 && curDist >= nextTargetDistM) {
            const ratio = Math.max(0, Math.min(1, (nextTargetDistM - prevDist) / segStep));
            const interpSec = run.timesSec[i - 1] + (run.timesSec[i] - run.timesSec[i - 1]) * ratio;
            const interpLat = run.coords[i - 1][0] + (run.coords[i][0] - run.coords[i - 1][0]) * ratio;
            const interpLon = run.coords[i - 1][1] + (run.coords[i][1] - run.coords[i - 1][1]) * ratio;

            const lapSec = Math.max(0.001, interpSec - segStartTimeSec);
            const segDist = Math.max(1, nextTargetDistM - segStartDistM);
            const sliceSpeeds = run.speeds.slice(segStartIdx, i + 1);
            const sliceElevs = run.elevs.slice(segStartIdx, i + 1);

            distanceSectors.push({
                label: `D${lapNo}`,
                lapNo,
                targetDistM: nextTargetDistM,
                segDistanceM: Math.round(segDist),
                splitSec: interpSec,
                toGoalSec: Math.max(0, run.totalTimeSec - interpSec),
                durationSec: lapSec,
                paceSecPerKm: lapSec / Math.max(0.001, segDist / 1000),
                maxSpeed: sliceSpeeds.length > 0 ? Math.max(...sliceSpeeds) : 0,
                minEle: sliceElevs.length > 0 ? Math.min(...sliceElevs) : 0,
                maxEle: sliceElevs.length > 0 ? Math.max(...sliceElevs) : 0,
                endCoord: [interpLat, interpLon],
                frameIndex: i
            });

            lapNo++;
            nextTargetDistM += gpxLapIntervalM;
            segStartIdx = i;
            segStartTimeSec = interpSec;
            segStartDistM = curDist;
        }
    }

    const lastIdx = run.coords.length - 1;
    const finalElapsedSec = run.timesSec[lastIdx];
    const finalDistM = run.dists[lastIdx];
    if (finalDistM > segStartDistM) {
        const remDist = Math.max(1, finalDistM - segStartDistM);
        const remSec = Math.max(0.001, finalElapsedSec - segStartTimeSec);
        const sliceSpeeds = run.speeds.slice(segStartIdx, lastIdx + 1);
        const sliceElevs = run.elevs.slice(segStartIdx, lastIdx + 1);

        distanceSectors.push({
            label: `D${lapNo}`,
            lapNo,
            targetDistM: Math.round(finalDistM),
            segDistanceM: Math.round(remDist),
            splitSec: finalElapsedSec,
            toGoalSec: 0,
            durationSec: remSec,
            paceSecPerKm: remSec / Math.max(0.001, remDist / 1000),
            maxSpeed: sliceSpeeds.length > 0 ? Math.max(...sliceSpeeds) : 0,
            minEle: sliceElevs.length > 0 ? Math.min(...sliceElevs) : 0,
            maxEle: sliceElevs.length > 0 ? Math.max(...sliceElevs) : 0,
            endCoord: run.coords[lastIdx],
            frameIndex: lastIdx
        });
    }
}

// 2. 任意セクター（SEC 1 ～ SEC 10・周回ごとの再通過＆3秒クールダウン対応）
function buildCustomSectors(run) {
    customSectors = [];
    const activeSecKeys = SECTOR_KEYS.filter(k => Boolean(gpxLines.sectors[k]));
    if (activeSecKeys.length === 0) return;

    const lapCrossSecs = [];
    if (gpxLines.lapLine) {
        let validDir = null;
        let lastLapSec = -999;
        for (let i = 1; i < run.coords.length; i++) {
            const hit = getLineIntersection(run.coords[i - 1], run.coords[i], gpxLines.lapLine);
            if (hit) {
                const interpSec = run.timesSec[i - 1] + (run.timesSec[i] - run.timesSec[i - 1]) * hit.t;
                if (validDir === null) {
                    validDir = hit.dir;
                    lapCrossSecs.push(interpSec);
                    lastLapSec = interpSec;
                } else if (hit.dir === validDir && (interpSec - lastLapSec > 4.0)) {
                    lapCrossSecs.push(interpSec);
                    lastLapSec = interpSec;
                }
            }
        }
    }

    const getLapNumberAtSec = (sec) => {
        if (lapCrossSecs.length === 0) return null;
        let lapNo = 1;
        for (let c = 0; c < lapCrossSecs.length; c++) {
            if (sec > lapCrossSecs[c] + 0.5) {
                lapNo = c + 2;
            }
        }
        return lapNo;
    };

    const hits = [];
    const lastHitSecByKey = {};
    let lastAnyHitSec = -999;

    for (let i = 1; i < run.coords.length; i++) {
        activeSecKeys.forEach(key => {
            const hit = getLineIntersection(run.coords[i - 1], run.coords[i], gpxLines.sectors[key]);
            if (hit) {
                const interpSec = run.timesSec[i - 1] + (run.timesSec[i] - run.timesSec[i - 1]) * hit.t;
                const prevSameSec = lastHitSecByKey[key] ?? -999;
                if (interpSec - prevSameSec < 10.0 || interpSec - lastAnyHitSec < 10.0) return;

                lastHitSecByKey[key] = interpSec;
                lastAnyHitSec = interpSec;

                const secNum = parseInt(key.replace(/\D/g, ''), 10);
                const lapNo = getLapNumberAtSec(interpSec);
                const label = lapNo ? `SEC${secNum}(L${lapNo})` : `SEC${secNum}`;
                const interpDist = run.dists[i - 1] + (run.dists[i] - run.dists[i - 1]) * hit.t;

                hits.push({
                    label,
                    secNum,
                    splitSec: interpSec,
                    targetDistM: Math.round(interpDist),
                    endCoord: hit.coord,
                    frameIndex: i
                });
            }
        });
    }

    if (hits.length === 0) return;
    hits.sort((a, b) => a.splitSec - b.splitSec);

    let prevIdx = 0;
    let prevTimeSec = 0;
    let prevDistM = 0;

    hits.forEach((h, idx) => {
        const durSec = Math.max(0.001, h.splitSec - prevTimeSec);
        const segDist = Math.max(1, h.targetDistM - prevDistM);
        const sliceSpeeds = run.speeds.slice(prevIdx, h.frameIndex + 1);
        const sliceElevs = run.elevs.slice(prevIdx, h.frameIndex + 1);

        customSectors.push({
            label: h.label,
            lapNo: idx + 1,
            targetDistM: h.targetDistM,
            segDistanceM: Math.round(segDist),
            splitSec: h.splitSec,
            toGoalSec: Math.max(0, run.totalTimeSec - h.splitSec),
            durationSec: durSec,
            paceSecPerKm: durSec / Math.max(0.001, segDist / 1000),
            maxSpeed: sliceSpeeds.length > 0 ? Math.max(...sliceSpeeds) : 0,
            minEle: sliceElevs.length > 0 ? Math.min(...sliceElevs) : 0,
            maxEle: sliceElevs.length > 0 ? Math.max(...sliceElevs) : 0,
            endCoord: h.endCoord,
            frameIndex: h.frameIndex
        });

        prevIdx = h.frameIndex;
        prevTimeSec = h.splitSec;
        prevDistM = h.targetDistM;
    });

    const lastIdx = run.coords.length - 1;
    if (run.totalTimeSec > prevTimeSec + 0.5) {
        const durSec = Math.max(0.001, run.totalTimeSec - prevTimeSec);
        const segDist = Math.max(1, run.totalDistM - prevDistM);
        const sliceSpeeds = run.speeds.slice(prevIdx, lastIdx + 1);
        const sliceElevs = run.elevs.slice(prevIdx, lastIdx + 1);

        customSectors.push({
            label: 'GOAL',
            lapNo: customSectors.length + 1,
            targetDistM: Math.round(run.totalDistM),
            segDistanceM: Math.round(segDist),
            splitSec: run.totalTimeSec,
            toGoalSec: 0,
            durationSec: durSec,
            paceSecPerKm: durSec / Math.max(0.001, segDist / 1000),
            maxSpeed: sliceSpeeds.length > 0 ? Math.max(...sliceSpeeds) : 0,
            minEle: sliceElevs.length > 0 ? Math.min(...sliceElevs) : 0,
            maxEle: sliceElevs.length > 0 ? Math.max(...sliceElevs) : 0,
            endCoord: run.coords[lastIdx],
            frameIndex: lastIdx
        });
    }
}

// 3. 周回ラップ（LAP_LINE）算出
function buildCircuitLaps(run) {
    circuitLaps = [];
    if (!gpxLines.lapLine) return;

    const crossings = [];
    let validDir = null;
    let lastCrossSec = -999;

    for (let i = 1; i < run.coords.length; i++) {
        const hit = getLineIntersection(run.coords[i - 1], run.coords[i], gpxLines.lapLine);
        if (hit) {
            const interpSec = run.timesSec[i - 1] + (run.timesSec[i] - run.timesSec[i - 1]) * hit.t;
            const interpDist = run.dists[i - 1] + (run.dists[i] - run.dists[i - 1]) * hit.t;
            if (validDir === null) {
                validDir = hit.dir;
                crossings.push({ sec: interpSec, dist: interpDist, coord: hit.coord, frameIndex: i });
                lastCrossSec = interpSec;
            } else if (hit.dir === validDir && (interpSec - lastCrossSec > 4.0)) {
                crossings.push({ sec: interpSec, dist: interpDist, coord: hit.coord, frameIndex: i });
                lastCrossSec = interpSec;
            }
        }
    }

    if (crossings.length < 2) return;

    for (let k = 1; k < crossings.length; k++) {
        const prev = crossings[k - 1];
        const cur = crossings[k];
        const durSec = Math.max(0.001, cur.sec - prev.sec);
        const segDist = Math.max(1, cur.dist - prev.dist);
        const sliceSpeeds = run.speeds.slice(prev.frameIndex, cur.frameIndex + 1);
        const sliceElevs = run.elevs.slice(prev.frameIndex, cur.frameIndex + 1);

        circuitLaps.push({
            label: `L${k}`,
            lapNo: k,
            targetDistM: Math.round(cur.dist),
            segDistanceM: Math.round(segDist),
            splitSec: cur.sec,
            toGoalSec: Math.max(0, run.totalTimeSec - cur.sec),
            durationSec: durSec,
            paceSecPerKm: durSec / Math.max(0.001, segDist / 1000),
            maxSpeed: sliceSpeeds.length > 0 ? Math.max(...sliceSpeeds) : 0,
            minEle: sliceElevs.length > 0 ? Math.min(...sliceElevs) : 0,
            maxEle: sliceElevs.length > 0 ? Math.max(...sliceElevs) : 0,
            endCoord: cur.coord,
            frameIndex: cur.frameIndex
        });
    }
}

function getActiveSectorList() {
    if (analysisMode === 'circuit') return circuitLaps;
    if (analysisMode === 'sector') return customSectors;
    return distanceSectors;
}

function renderSectorList() {
    const c = document.getElementById('lap-list-content');
    const bestBox = document.getElementById('best-sector-summary');
    const slowBox = document.getElementById('slow-sector-summary');
    const totalTimeEl = document.getElementById('start-goal-time');
    const totalMetaEl = document.getElementById('start-goal-meta');
    if (!c) return;

    const activeList = getActiveSectorList();

    if (!fullRunData || activeList.length === 0) {
        totalTimeEl.innerText = fullRunData ? formatLapTime(fullRunData.totalTimeSec) : "-";
        totalMetaEl.innerText = fullRunData ? `DIST: ${Math.round(fullRunData.totalDistM)}m` : "-";
        bestBox.innerText = "-";
        slowBox.innerText = "-";
        const emptyMsg = analysisMode === 'sector'
            ? "任意セクター（SEC1〜SEC10）の通過データがありません"
            : analysisMode === 'circuit'
                ? "周回ライン（LAP_LINE）の周回データがありません"
                : "セクターデータがありません";
        c.innerHTML = `<div style="padding:20px; text-align:center; color:#888;">${emptyMsg}</div>`;
        return;
    }

    const totalSec = fullRunData.totalTimeSec || 0;
    const totalDist = fullRunData.totalDistM || 0;
    const avgPace = totalDist > 0 ? totalSec / (totalDist / 1000) : 0;
    totalTimeEl.innerText = formatLapTime(totalSec);
    totalMetaEl.innerHTML = `DIST: <b>${Math.round(totalDist)}m</b> / AVG PACE: <b>${formatPace(avgPace)}/km</b>`;

    let bestSec = activeList[0];
    let slowSec = activeList[0];
    activeList.forEach(sec => {
        if (analysisMode === 'circuit') {
            if (sec.durationSec < bestSec.durationSec) bestSec = sec;
            if (sec.durationSec > slowSec.durationSec) slowSec = sec;
        } else {
            if (sec.paceSecPerKm < bestSec.paceSecPerKm) bestSec = sec;
            if (sec.paceSecPerKm > slowSec.paceSecPerKm) slowSec = sec;
        }
    });

    bestBox.innerHTML = `${bestSec.label} (${bestSec.targetDistM}m) : <span style="color:var(--hrc-red); font-weight:bold;">${formatLapTime(bestSec.durationSec)}</span> (${formatPace(bestSec.paceSecPerKm)}/km)`;
    slowBox.innerHTML = `${slowSec.label} (${slowSec.targetDistM}m) : <span style="color:var(--hrc-blue); font-weight:bold;">${formatLapTime(slowSec.durationSec)}</span> (${formatPace(slowSec.paceSecPerKm)}/km)`;

    const globalMaxS = Math.max(...activeList.map(s => s.maxSpeed));

    c.innerHTML = `<div class="lap-row list-header"><span>SEC</span><span>DIST</span><span>SPLIT</span><span>TIME</span><span>PACE</span><span>MAX</span><span>ELEV</span><span>TO GOAL</span></div>`;

    activeList.forEach((sec) => {
        const isBest = (sec.lapNo === bestSec.lapNo);
        const isSlow = (sec.lapNo === slowSec.lapNo && activeList.length > 1);
        const row = document.createElement('div');
        row.className = `lap-row ${isBest ? 'row-best' : ''} ${isSlow ? 'row-slow' : ''}`;
        const labelStyle = analysisMode === 'sector' ? 'color:var(--hrc-cyan); font-weight:bold;' : '';

        row.innerHTML = `
            <span style="${labelStyle}">${sec.label}</span>
            <span>${sec.targetDistM}m</span>
            <span>${formatLapTime(sec.splitSec)}</span>
            <span class="${isBest ? 'lap-best' : isSlow ? 'lap-slow' : ''}">${formatLapTime(sec.durationSec)}</span>
            <span class="${isBest ? 'lap-best' : isSlow ? 'lap-slow' : ''}">${formatPace(sec.paceSecPerKm)}</span>
            <span class="${sec.maxSpeed >= globalMaxS && sec.maxSpeed > 0 ? 'stat-best' : ''}">${Math.round(sec.maxSpeed)}</span>
            <span>${Math.round(sec.minEle)}-${Math.round(sec.maxEle)}m</span>
            <span style="color:var(--hrc-yellow);">${formatLapTime(sec.toGoalSec)}</span>
        `;

        row.onclick = () => {
            isPlaying = false;
            document.getElementById('playBtn').innerText = "PLAY";
            currentFrame = sec.frameIndex;
            document.getElementById('seek-bar').value = currentFrame;
            document.getElementById('lap-list-overlay').style.display = 'none';
            updateFrame();
        };

        c.appendChild(row);
    });
}

function closeLapList() {
    document.getElementById('lap-list-overlay').style.display = 'none';
    updateFrame();
}

function updateUI() {
    if (!fullRunData || fullRunData.coords.length === 0) return;

    const seekBar = document.getElementById('seek-bar');
    if (seekBar) {
        seekBar.max = Math.max(0, fullRunData.speeds.length - 1);
        if (!isPlaying) {
            currentFrame = 0;
            seekBar.value = 0;
        }
    }

    if (window.pathLayer) {
        map.removeLayer(window.pathLayer);
    }

    const g = L.featureGroup();
    const movingSpeeds = fullRunData.speeds.filter(s => s > 2);
    const maxS = Math.max(...fullRunData.speeds, 1);
    const minS = movingSpeeds.length > 0 ? Math.min(...movingSpeeds) : 0;
    const range = (maxS - minS) || 1;

    for (let i = 1; i < fullRunData.coords.length; i++) {
        let ratio = Math.max(0, Math.min(1, (fullRunData.speeds[i] - minS) / range));
        let r = 0, g_val = 0, b = 0;
        if (ratio < 0.5) {
            g_val = Math.floor(255 * (ratio * 2));
            b = Math.floor(255 * (1 - ratio * 2));
        } else {
            r = Math.floor(255 * ((ratio - 0.5) * 2));
            g_val = Math.floor(255 * (1 - (ratio - 0.5) * 2));
        }

        L.polyline([
            [fullRunData.coords[i - 1][0] + latOffset, fullRunData.coords[i - 1][1] + lonOffset],
            [fullRunData.coords[i][0] + latOffset, fullRunData.coords[i][1] + lonOffset]
        ], {
            color: `rgb(${r}, ${g_val}, ${b})`,
            weight: 4,
            opacity: 0.95
        }).addTo(g);
    }

    const activeList = getActiveSectorList();
    activeList.forEach((sec) => {
        if (!sec.endCoord) return;
        const latlng = [sec.endCoord[0] + latOffset, sec.endCoord[1] + lonOffset];
        const isCustom = (analysisMode === 'sector');
        const pin = L.circleMarker(latlng, {
            radius: 5,
            color: '#000',
            weight: 1.5,
            fillColor: isCustom ? '#00e5ff' : '#ffff00',
            fillOpacity: 0.95
        });
        pin.bindTooltip(`${sec.label} (${sec.targetDistM}m)`, {
            permanent: true,
            direction: 'top',
            offset: [0, -4],
            className: isCustom ? 'custom-sector-label' : 'sector-pin-label'
        });
        pin.addTo(g);
    });

    const lineConfigs = [
        { key: 'startLine', color: '#E4002B', label: 'START' },
        { key: 'goalLine',  color: '#28a745', label: 'GOAL' },
        { key: 'lapLine',   color: '#9c27b0', label: 'S/G (LAP)' }
    ];
    lineConfigs.forEach(cfg => {
        const line = gpxLines[cfg.key];
        if (!line) return;
        const p1 = [line.p1[0] + latOffset, line.p1[1] + lonOffset];
        const p2 = [line.p2[0] + latOffset, line.p2[1] + lonOffset];
        L.polyline([p1, p2], {
            color: cfg.color,
            weight: 5,
            opacity: 0.95
        }).bindTooltip(cfg.label, {
            permanent: true,
            direction: 'center',
            className: 'sector-pin-label'
        }).addTo(g);
    });

    SECTOR_KEYS.forEach((key, idx) => {
        const line = gpxLines.sectors[key];
        if (!line) return;
        const p1 = [line.p1[0] + latOffset, line.p1[1] + lonOffset];
        const p2 = [line.p2[0] + latOffset, line.p2[1] + lonOffset];
        L.polyline([p1, p2], {
            color: '#00e5ff',
            weight: 4,
            dashArray: '6, 6',
            opacity: 0.95
        }).bindTooltip(`SEC${idx + 1}`, {
            permanent: true,
            direction: 'center',
            className: 'custom-sector-label'
        }).addTo(g);
    });

    window.pathLayer = g.addTo(map);

    if (!window.isMapInit) {
        const bounds = g.getBounds();
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [30, 30] });
            window.isMapInit = true;
        }
    }

    createCharts();
    updateFrame();
}

function createCharts() {
    if (!fullRunData) return;

    const datasets = [
        {
            label: 'SPD (km/h)',
            data: fullRunData.speeds,
            borderColor: '#33ccff',
            pointRadius: 0,
            tension: 0.35,
            yAxisID: 'y',
            borderWidth: 2.5
        },
        {
            label: 'ELEV (m)',
            data: fullRunData.elevs,
            borderColor: '#33ff77',
            backgroundColor: 'rgba(51, 255, 119, 0.14)',
            fill: true,
            pointRadius: 0,
            tension: 0.35,
            yAxisID: 'y1',
            borderWidth: 2
        }
    ];

    if (mainChart) mainChart.destroy();
    const annotations = { now: { type: 'line', xMin: currentFrame, xMax: currentFrame, borderColor: '#fff', borderWidth: 2 } };
    if (idxA !== null) annotations.lineA = { type: 'line', xMin: idxA, xMax: idxA, borderColor: '#ffff00', borderWidth: 1, borderDash: [5, 5] };
    if (idxB !== null) annotations.lineB = { type: 'line', xMin: idxB, xMax: idxB, borderColor: '#ffff00', borderWidth: 1, borderDash: [5, 5] };

    customSectors.forEach((sec, idx) => {
        if (sec.label === 'GOAL') return;
        annotations[`secLine_${idx}`] = {
            type: 'line',
            xMin: sec.frameIndex,
            xMax: sec.frameIndex,
            borderColor: '#00e5ff',
            borderWidth: 1.5,
            borderDash: [4, 4],
            label: {
                display: true,
                content: sec.label,
                position: 'start',
                backgroundColor: 'rgba(0, 20, 28, 0.85)',
                color: '#00e5ff',
                font: { size: 9, weight: 'bold' },
                padding: 2
            }
        };
    });

    mainChart = new Chart(document.getElementById('mainChart').getContext('2d'), {
        type: 'line',
        data: { labels: fullRunData.dists.map(d => `${Math.round(d)}m`), datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: false },
                y: {
                    position: 'left',
                    min: 0,
                    title: { display: true, text: 'SPD (km/h)', color: '#33ccff', font: { size: 10 } },
                    ticks: { color: '#33ccff', font: { size: 10 } },
                    grid: { color: '#222' }
                },
                y1: {
                    position: 'right',
                    title: { display: true, text: 'ELEV (m)', color: '#33ff77', font: { size: 10 } },
                    ticks: { color: '#33ff77', font: { size: 10 } },
                    grid: { drawOnChartArea: false }
                }
            },
            plugins: {
                legend: { display: true, labels: { color: '#fff', boxWidth: 12, font: { size: 10 } } },
                annotation: { annotations }
            }
        }
    });
}

function updateFrame() {
    if (!fullRunData || fullRunData.coords.length === 0) return;
    const idx = Math.min(currentFrame, fullRunData.speeds.length - 1);
    markerP.setLatLng([fullRunData.coords[idx][0] + latOffset, fullRunData.coords[idx][1] + lonOffset]);

    document.getElementById('p-time').innerText = formatLapTime(fullRunData.timesSec[idx]);
    document.getElementById('p-spd').innerText = `${Math.round(fullRunData.speeds[idx])}`;
    document.getElementById('p-ele').innerText = `${fullRunData.elevs[idx].toFixed(1)}m`;
    document.getElementById('p-dist').innerText = `${Math.round(fullRunData.dists[idx])}m`;

    if (idxA !== null && idxB !== null) {
        const aIdx = Math.min(idxA, fullRunData.timesSec.length - 1);
        const bIdx = Math.min(idxB, fullRunData.timesSec.length - 1);
        document.getElementById('p-ab').innerText = Math.abs(fullRunData.timesSec[bIdx] - fullRunData.timesSec[aIdx]).toFixed(2) + "s";
    }

    if (mainChart) {
        mainChart.options.plugins.annotation.annotations.now.xMin = idx;
        mainChart.options.plugins.annotation.annotations.now.xMax = idx;
        mainChart.update('resize');
    }
}

document.getElementById('btnSetA').onclick = () => { idxA = currentFrame; createCharts(); updateFrame(); };
document.getElementById('btnSetB').onclick = () => { idxB = currentFrame; createCharts(); updateFrame(); };
document.getElementById('openListBtn').onclick = () => {
    updateModeTabs();
    renderSectorList();
    document.getElementById('lap-list-overlay').style.display = 'flex';
};

document.getElementById('playBtn').onclick = function() {
    if (!fullRunData || fullRunData.coords.length === 0) return;
    isPlaying = !isPlaying;
    this.innerText = isPlaying ? "PAUSE" : "PLAY";
    if (isPlaying) animate();
};

function animate() {
    if (!isPlaying || !fullRunData) return;
    if (currentFrame >= fullRunData.speeds.length - 1) {
        isPlaying = false;
        document.getElementById('playBtn').innerText = "PLAY";
        return;
    }
    currentFrame++;
    document.getElementById('seek-bar').value = currentFrame;
    updateFrame();
    requestAnimationFrame(animate);
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Register Failed!', err));
    });
}
</script>

</body>
