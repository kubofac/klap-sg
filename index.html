<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <title>KLAP MARATHON SETTINGS</title>
    <style>
        :root { --hrc-red: #D40024; --hrc-black: #000000; --bg-light: #ffffff; --hrc-orange: #D96B00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-light); color: var(--hrc-black); font-family: sans-serif; overflow: hidden; }
        #map-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; }

        #center-crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin-left: -12px;
            margin-top: -12px;
            z-index: 500;
            pointer-events: none;
        }
        #center-crosshair::before,
        #center-crosshair::after {
            content: '';
            position: absolute;
            background: rgba(212, 0, 36, 0.85);
        }
        #center-crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #center-crosshair::after { left: 11px; top: 0; width: 2px; height: 24px; }

        .top-bar { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; padding-top: env(safe-area-inset-top); pointer-events: none; }
        .top-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; pointer-events: auto; touch-action: none; }

        .ui-btn { background: rgba(255,255,255,0.95); color: #000; border: 1px solid #999; border-radius: 6px; padding: 8px 10px; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2); touch-action: manipulation; user-select: none; }
        .ui-btn.active { background: var(--hrc-red); color: #fff; border-color: var(--hrc-red); }
        .ui-btn.turn-active { background: var(--hrc-orange); color: #fff; border-color: var(--hrc-orange); }
        .ui-btn.point-active { background: #0077cc; color: #fff; border-color: #0077cc; }
        .ui-btn.primary { background: var(--hrc-red); color: #fff; border-color: var(--hrc-red); }
        .ui-btn.blue { background: #0077cc; color: #fff; border-color: #0077cc; }
        .ui-btn.danger { background: #d9534f; color: #fff; border-color: #d9534f; }

        .panel-box { background: rgba(255,255,255,0.95); border: 1px solid #bbb; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); touch-action: manipulation; max-width: 100%; box-sizing: border-box; }
        .panel-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .panel-row:last-child { margin-bottom: 0; }
        select, input[type="number"], input[type="text"], input[type="password"] { border: 1px solid #aaa; border-radius: 4px; padding: 5px 6px; font-size: 12px; background: #fff; color: #000; touch-action: manipulation; }
        input[type="number"] { width: 82px; }
        input[type="text"] { width: 170px; }

        .status-badge { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #eee; color: #222; }
        .status-badge.ok { background: #e6f7ec; color: #137333; border: 1px solid #34a853; }
        .coord-text { font-family: monospace; font-size: 10px; color: #333; background: #f7f7f7; padding: 3px 6px; border-radius: 4px; border: 1px solid #ddd; }
        .my-course-box { background: #eef7ff; border: 1px solid #bce0ff; border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        #authLockOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .auth-card {
            background: #fff;
            color: #000;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            text-align: center;
        }
        .auth-card h3 { margin: 0 0 8px; font-size: 16px; }
        .auth-card p { margin: 0 0 12px; font-size: 12px; color: #444; }
        .auth-card input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
        .auth-error { color: var(--hrc-red); font-size: 12px; font-weight: bold; min-height: 18px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="authLockOverlay">
    <div class="auth-card">
        <h3>KLAP パスワード認証</h3>
        <p>設定画面を利用するにはパスワードが必要です。</p>
        <input type="password" id="authPassInput" placeholder="パスワードを入力">
        <div id="authErrorMsg" class="auth-error"></div>
        <button id="authSubmitBtn" type="button" class="ui-btn primary" style="width:100%; padding:10px; font-size:13px;">認証する</button>
    </div>
</div>

<div id="map-container">
    <div id="map"></div>
</div>
<div id="center-crosshair"></div>

<div class="top-bar" id="topBar">
    <div class="top-row">
        <button id="gpsBtn" type="button" class="ui-btn">現在地へ移動</button>
        <button id="modeStartBtn" type="button" class="ui-btn">START</button>
        <button id="modeGoalBtn" type="button" class="ui-btn">GOAL</button>
        <button id="modeTurnBtn" type="button" class="ui-btn">折り返し(TURN)</button>
        <button id="modeLapBtn" type="button" class="ui-btn">LAP</button>
        <button id="modeSecBtn" type="button" class="ui-btn">セクター(S1-S10)</button>
        <button id="setP1Btn" type="button" class="ui-btn point-active">P1指定</button>
        <button id="setP2Btn" type="button" class="ui-btn">P2指定</button>
        <button id="putP1CenterBtn" type="button" class="ui-btn">中心をP1に置く</button>
        <button id="putP2CenterBtn" type="button" class="ui-btn">中心をP2に置く</button>
        <button id="clearLineBtn" type="button" class="ui-btn">選択ライン消去</button>
        <button id="clearAllBtn" type="button" class="ui-btn">全ライン消去</button>
    </div>

    <div class="top-row">
        <div class="panel-box">
            <div class="panel-row">
                <label>モード:
                    <select id="courseModeSelect">
                        <option value="marathon">マラソン / 区間</option>
                        <option value="circuit">サーキット / 周回</option>
                    </select>
                </label>
                <label id="lapIntervalWrap">距離ラップ間隔(m):
                    <input type="number" id="lapIntervalInput" min="0" step="10" value="0">
                </label>
                <label id="circuitLapsWrap" style="display:none;">周回数(0=∞):
                    <input type="number" id="circuitLapsInput" min="0" step="1" value="0">
                </label>
                <label id="secSelectWrap">セクター番号:
                    <select id="sectorNumSelect"></select>
                </label>
            </div>

            <div class="panel-row">
                <div class="my-course-box">
                    <span style="font-weight:bold; color:#1565C0;">マイコース:</span>
                    <select id="courseSelect">
                        <option value="">-- 保存済みコースを選択 --</option>
                    </select>
                    <button id="applyCourseBtn" type="button" class="ui-btn blue">反映</button>
                    <button id="deleteCourseBtn" type="button" class="ui-btn danger" style="display:none;">削除</button>
                    <input type="text" id="newCourseName" placeholder="新規コース名">
                    <button id="saveNewCourseBtn" type="button" class="ui-btn">追加保存</button>
                    <span id="selectedCourseDisplay" class="coord-text">未選択</span>
                </div>
            </div>

            <div class="panel-row">
                <span id="p1CoordText" class="coord-text">P1: -</span>
                <span id="p2CoordText" class="coord-text">P2: -</span>
                <span id="drawGuide" class="status-badge">P1・P2を指定してください</span>
                <span id="turnAutoHint" class="status-badge">折り返し未設定</span>
                <button id="saveBtn" type="button" class="ui-btn primary">保存してタイマーへ</button>
                <button id="goTimerBtn" type="button" class="ui-btn blue">タイマー画面へ</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
'use strict';

const AUTH_KEY = 'klap_auth_v1';
const AUTH_TOKEN = "a2xhcDIwMjY=";
let appInitialized = false;

function isAuthenticated() {
    return localStorage.getItem(AUTH_KEY) === AUTH_TOKEN;
}

function showAuthLock(errorText = '') {
    const overlay = document.getElementById('authLockOverlay');
    const errEl = document.getElementById('authErrorMsg');
    const inputEl = document.getElementById('authPassInput');
    overlay.style.display = 'flex';
    errEl.textContent = errorText;
    if (inputEl) {
        inputEl.focus();
    }
}

function hideAuthLock() {
    document.getElementById('authLockOverlay').style.display = 'none';
    document.getElementById('authErrorMsg').textContent = '';
}

function verifyPasswordInput() {
    const inputEl = document.getElementById('authPassInput');
    const pass = (inputEl ? inputEl.value : '').trim();
    if (pass === "klap2026") {
        localStorage.setItem(AUTH_KEY, AUTH_TOKEN);
        hideAuthLock();
        initializeAppOnce();
    } else {
        showAuthLock("パスワードが異なります。再入力してください。");
    }
}

function ensureAuthOrLock() {
    if (isAuthenticated()) {
        hideAuthLock();
        return true;
    }
    const pass = prompt("KLAP パスワードを入力してください:");
    if (pass === "klap2026") {
        localStorage.setItem(AUTH_KEY, AUTH_TOKEN);
        hideAuthLock();
        return true;
    }
    showAuthLock("パスワードが異なります。正しいパスワードを入力してください。");
    return false;
}

const SECTOR_KEYS = Array.from({ length: 10 }, (_, i) => `sec${i + 1}Line`);
const CUSTOM_COURSE_STORAGE_KEY = 'customMarathonList';

let map = null;
let drawMode = 'startLine'; // 'startLine' | 'goalLine' | 'turnLine' | 'lapLine' | 'sector'
let activePoint = 'p1'; // 'p1' | 'p2'
let lines = { startLine: null, goalLine: null, turnLine: null, lapLine: null, sectors: {} };
let renderedLayers = [];
let activeLinePolyline = null;
let p1EditMarker = null;
let p2EditMarker = null;
let isDraggingEndpoint = false;

function getActiveLineKey() {
    if (drawMode === 'sector') {
        const num = parseInt(document.getElementById('sectorNumSelect').value, 10) || 1;
        return `sec${num}Line`;
    }
    return drawMode;
}

function getLineByKey(key) {
    if (key.startsWith('sec')) return lines.sectors[key] || null;
    return lines[key] || null;
}

function setLineByKey(key, val) {
    if (key.startsWith('sec')) {
        lines.sectors[key] = val;
    } else {
        lines[key] = val;
    }
}

function cloneLine(line) {
    if (!line || !line.p1 || !line.p2) return null;
    return {
        p1: { lat: Number(line.p1.lat), lon: Number(line.p1.lon) },
        p2: { lat: Number(line.p2.lat), lon: Number(line.p2.lon) }
    };
}

function readLineFromStorage(key) {
    const p1Lat = parseFloat(localStorage.getItem(key + 'P1Lat'));
    const p1Lon = parseFloat(localStorage.getItem(key + 'P1Lon'));
    const p2Lat = parseFloat(localStorage.getItem(key + 'P2Lat'));
    const p2Lon = parseFloat(localStorage.getItem(key + 'P2Lon'));
    if (!isNaN(p1Lat) && !isNaN(p1Lon) && !isNaN(p2Lat) && !isNaN(p2Lon)) {
        return { p1: { lat: p1Lat, lon: p1Lon }, p2: { lat: p2Lat, lon: p2Lon } };
    }
    return null;
}

function saveLineToStorage(key, line) {
    if (!line || !line.p1 || !line.p2) {
        localStorage.removeItem(key + 'P1Lat');
        localStorage.removeItem(key + 'P1Lon');
        localStorage.removeItem(key + 'P2Lat');
        localStorage.removeItem(key + 'P2Lon');
        return;
    }
    localStorage.setItem(key + 'P1Lat', line.p1.lat);
    localStorage.setItem(key + 'P1Lon', line.p1.lon);
    localStorage.setItem(key + 'P2Lat', line.p2.lat);
    localStorage.setItem(key + 'P2Lon', line.p2.lon);
}

// 折り返しライン有効時：GOAL未設定ならSTARTを自動反映し、S1〜S4をS5〜S8へ逆順コピー
function applyTurnReturnRules(showNotice = false) {
    const hintEl = document.getElementById('turnAutoHint');
    if (!lines.turnLine || !lines.turnLine.p1 || !lines.turnLine.p2) {
        hintEl.textContent = '折り返し未設定';
        hintEl.classList.remove('ok');
        return;
    }

    let copiedCount = 0;
    let goalSet = false;

    if ((!lines.goalLine || !lines.goalLine.p1 || !lines.goalLine.p2) && (lines.startLine && lines.startLine.p1 && lines.startLine.p2)) {
        lines.goalLine = cloneLine(lines.startLine);
        goalSet = true;
    }

    const forwardIndices = [1, 2, 3, 4].filter(n => {
        const s = lines.sectors[`sec${n}Line`];
        return Boolean(s && s.p1 && s.p2);
    });
    const reversed = [...forwardIndices].reverse();
    reversed.forEach((srcNum, idx) => {
        const dstNum = 5 + idx;
        const dstKey = `sec${dstNum}Line`;
        const dst = lines.sectors[dstKey];
        if (dstNum <= 10 && (!dst || !dst.p1 || !dst.p2)) {
            lines.sectors[dstKey] = cloneLine(lines.sectors[`sec${srcNum}Line`]);
            copiedCount++;
        }
    });

    hintEl.textContent = `折り返しON (復路S5-S8逆順連携${copiedCount > 0 ? ': +' + copiedCount : ''})`;
    hintEl.classList.add('ok');

    if (showNotice && (goalSet || copiedCount > 0)) {
        const parts = [];
        if (goalSet) parts.push('GOAL=START自動設定');
        if (copiedCount > 0) parts.push(`S1〜S4をS5〜S8へ逆順コピー(${copiedCount}本)`);
        document.getElementById('drawGuide').textContent = `折り返し適用: ${parts.join(' / ')}`;
    }
}

function updatePointUI() {
    document.getElementById('setP1Btn').classList.toggle('point-active', activePoint === 'p1');
    document.getElementById('setP2Btn').classList.toggle('point-active', activePoint === 'p2');

    const key = getActiveLineKey();
    const line = getLineByKey(key);
    updateCoordLabelsOnly(line);
}

function updateCoordLabelsOnly(line) {
    const p1El = document.getElementById('p1CoordText');
    const p2El = document.getElementById('p2CoordText');
    p1El.textContent = (line && line.p1)
        ? `P1: ${line.p1.lat.toFixed(6)}, ${line.p1.lon.toFixed(6)}`
        : 'P1: 未設定';
    p2El.textContent = (line && line.p2)
        ? `P2: ${line.p2.lat.toFixed(6)}, ${line.p2.lon.toFixed(6)}`
        : 'P2: 未設定';
}

function createEndpointIcon(pointName, isSelected) {
    const bg = pointName === 'p1' ? '#E4002B' : '#0077cc';
    const ring = isSelected ? '3px solid #ffff00' : '2px solid #ffffff';
    return L.divIcon({
        className: 'endpoint-pin-icon',
        html: `<div style="width:20px;height:20px;border-radius:50%;background:${bg};border:${ring};color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.45);user-select:none;touch-action:none;">${pointName === 'p1' ? 'P1' : 'P2'}</div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
    });
}

function syncActiveEndpointEditors(line, color) {
    if (activeLinePolyline) {
        map.removeLayer(activeLinePolyline);
        activeLinePolyline = null;
    }
    if (p1EditMarker) {
        map.removeLayer(p1EditMarker);
        p1EditMarker = null;
    }
    if (p2EditMarker) {
        map.removeLayer(p2EditMarker);
        p2EditMarker = null;
    }

    if (!line) return;

    if (line.p1 && line.p2) {
        activeLinePolyline = L.polyline(
            [[line.p1.lat, line.p1.lon], [line.p2.lat, line.p2.lon]],
            { color, weight: 5, opacity: 0.95, interactive: false }
        ).addTo(map);
    }

    const bindEndpointDrag = (marker, ptKey) => {
        marker.on('mousedown touchstart', (ev) => {
            L.DomEvent.stopPropagation(ev);
            activePoint = ptKey;
            isDraggingEndpoint = true;
            map.dragging.disable();
            updatePointUI();
        });
        marker.on('dragstart', () => {
            isDraggingEndpoint = true;
            map.dragging.disable();
        });
        marker.on('drag', (ev) => {
            const latlng = ev.target.getLatLng();
            const key = getActiveLineKey();
            const cur = getLineByKey(key) || { p1: null, p2: null };
            const updated = {
                p1: cur.p1 ? { ...cur.p1 } : null,
                p2: cur.p2 ? { ...cur.p2 } : null
            };
            updated[ptKey] = { lat: latlng.lat, lon: latlng.lng };
            setLineByKey(key, updated);
            if (updated.p1 && updated.p2 && activeLinePolyline) {
                activeLinePolyline.setLatLngs([[updated.p1.lat, updated.p1.lon], [updated.p2.lat, updated.p2.lon]]);
            }
            updateCoordLabelsOnly(updated);
        });
        marker.on('dragend', (ev) => {
            const latlng = ev.target.getLatLng();
            const key = getActiveLineKey();
            const cur = getLineByKey(key) || { p1: null, p2: null };
            const updated = {
                p1: cur.p1 ? { ...cur.p1 } : null,
                p2: cur.p2 ? { ...cur.p2 } : null
            };
            updated[ptKey] = { lat: latlng.lat, lon: latlng.lng };
            setLineByKey(key, updated);
            isDraggingEndpoint = false;
            map.dragging.enable();
            if (updated.p1 && updated.p2 && (key === 'turnLine' || key.startsWith('sec'))) {
                applyTurnReturnRules(true);
            }
            updatePointUI();
            redrawLines();
        });
    };

    if (line.p1) {
        p1EditMarker = L.marker([line.p1.lat, line.p1.lon], {
            draggable: true,
            autoPan: false,
            zIndexOffset: 900,
            icon: createEndpointIcon('p1', activePoint === 'p1')
        }).addTo(map);
        bindEndpointDrag(p1EditMarker, 'p1');
    }

    if (line.p2) {
        p2EditMarker = L.marker([line.p2.lat, line.p2.lon], {
            draggable: true,
            autoPan: false,
            zIndexOffset: 900,
            icon: createEndpointIcon('p2', activePoint === 'p2')
        }).addTo(map);
        bindEndpointDrag(p2EditMarker, 'p2');
    }
}

function setPointCoord(lat, lon, targetPoint = activePoint) {
    if (!isAuthenticated()) return;
    const key = getActiveLineKey();
    const current = getLineByKey(key) || { p1: null, p2: null };
    const next = {
        p1: current.p1 ? { ...current.p1 } : null,
        p2: current.p2 ? { ...current.p2 } : null
    };
    next[targetPoint] = { lat, lon };
    setLineByKey(key, next);

    if (next.p1 && next.p2 && (key === 'turnLine' || key.startsWith('sec'))) {
        applyTurnReturnRules(true);
    }

    updatePointUI();
    redrawLines();

    const labelMap = {
        startLine: 'START',
        goalLine: 'GOAL',
        turnLine: 'TURN',
        lapLine: 'LAP'
    };
    const name = labelMap[key] || key.replace('sec', 'S').replace('Line', '');
    document.getElementById('drawGuide').textContent = `${name} の ${targetPoint.toUpperCase()} を更新しました`;
}

function getLineColor(key) {
    if (key === 'startLine') return '#E4002B';
    if (key === 'goalLine') return '#28a745';
    if (key === 'turnLine') return '#D96B00';
    if (key === 'lapLine') return '#9c27b0';
    return '#00838f';
}

function redrawLines() {
    renderedLayers.forEach(layer => map.removeLayer(layer));
    renderedLayers = [];

    const activeKey = getActiveLineKey();

    const drawOtherLine = (key, line, color, label, dashArray = null) => {
        if (!line || !line.p1 || !line.p2 || key === activeKey) return;
        const poly = L.polyline(
            [[line.p1.lat, line.p1.lon], [line.p2.lat, line.p2.lon]],
            { color, weight: 4, dashArray, opacity: 0.85, interactive: false }
        ).addTo(map);
        poly.bindTooltip(label, { permanent: true, direction: 'center' });
        renderedLayers.push(poly);
    };

    drawOtherLine('startLine', lines.startLine, getLineColor('startLine'), 'START');
    drawOtherLine('goalLine', lines.goalLine, getLineColor('goalLine'), 'GOAL');
    drawOtherLine('turnLine', lines.turnLine, getLineColor('turnLine'), 'TURN');
    drawOtherLine('lapLine', lines.lapLine, getLineColor('lapLine'), 'LAP');

    SECTOR_KEYS.forEach((key, idx) => {
        drawOtherLine(key, lines.sectors[key], getLineColor(key), `S${idx + 1}`, '5, 5');
    });

    const activeLine = getLineByKey(activeKey);
    syncActiveEndpointEditors(activeLine, getLineColor(activeKey));
}

function setDrawMode(mode) {
    drawMode = mode;

    document.getElementById('modeStartBtn').classList.toggle('active', mode === 'startLine');
    document.getElementById('modeGoalBtn').classList.toggle('active', mode === 'goalLine');
    document.getElementById('modeTurnBtn').classList.toggle('turn-active', mode === 'turnLine');
    document.getElementById('modeLapBtn').classList.toggle('active', mode === 'lapLine');
    document.getElementById('modeSecBtn').classList.toggle('active', mode === 'sector');

    const activeKey = getActiveLineKey();
    const labelMap = {
        startLine: 'STARTライン',
        goalLine: 'GOALライン',
        turnLine: '折り返し(TURN)ライン',
        lapLine: 'LAPライン',
    };
    const name = labelMap[activeKey] || activeKey.replace('sec', 'S').replace('Line', 'ライン');
    document.getElementById('drawGuide').textContent = `${name} の ${activePoint.toUpperCase()} をピンドラッグ・中心配置・地図タップで指定できます`;
    updatePointUI();
    redrawLines();
}

function syncCourseModeUI() {
    const mode = document.getElementById('courseModeSelect').value;
    document.getElementById('circuitLapsWrap').style.display = (mode === 'circuit') ? 'inline-block' : 'none';
}

function initSelectorOptions() {
    const sel = document.getElementById('sectorNumSelect');
    sel.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = `S${i}`;
        sel.appendChild(opt);
    }
}

// マイコース（customMarathonList）管理
function getCustomCourseList() {
    try {
        const parsed = JSON.parse(localStorage.getItem(CUSTOM_COURSE_STORAGE_KEY));
        return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
        return [];
    }
}

function toggleDeleteCourseButton() {
    const id = document.getElementById('courseSelect').value;
    document.getElementById('deleteCourseBtn').style.display = id ? 'inline-block' : 'none';
}

function updateCourseSelectMenu(selectedId = '') {
    const select = document.getElementById('courseSelect');
    select.innerHTML = '<option value="">-- 保存済みコースを選択 --</option>';
    const list = getCustomCourseList();
    list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        const lapsInfo = item.targetLaps > 0 ? `${item.targetLaps}周` : '∞';
        const tag = item.courseMode === 'circuit' ? `[周回:${lapsInfo}]` : '[区間]';
        opt.textContent = `${tag} ${item.name}`;
        select.appendChild(opt);
    });
    if (selectedId) {
        select.value = selectedId;
    }
    toggleDeleteCourseButton();
}

function saveNewCustomCourse() {
    if (!isAuthenticated()) return;
    const nameInput = document.getElementById('newCourseName');
    const name = nameInput.value.trim();
    if (!name) {
        alert("コース名を入力してください。");
        return;
    }

    applyTurnReturnRules(false);

    const id = 'course_' + Date.now();
    const sectorsObj = {};
    SECTOR_KEYS.forEach(k => {
        const s = lines.sectors[k];
        sectorsObj[k] = (s && s.p1 && s.p2) ? cloneLine(s) : null;
    });

    const courseMode = document.getElementById('courseModeSelect').value || 'marathon';
    const targetLaps = Math.max(0, Math.floor(Number(document.getElementById('circuitLapsInput').value) || 0));
    const lapIntervalM = Math.max(0, Math.floor(Number(document.getElementById('lapIntervalInput').value) || 0));

    const payload = {
        id,
        name,
        courseMode,
        targetLaps,
        startLine: (lines.startLine && lines.startLine.p1 && lines.startLine.p2) ? cloneLine(lines.startLine) : null,
        goalLine: (lines.goalLine && lines.goalLine.p1 && lines.goalLine.p2) ? cloneLine(lines.goalLine) : null,
        turnLine: (lines.turnLine && lines.turnLine.p1 && lines.turnLine.p2) ? cloneLine(lines.turnLine) : null,
        lapLine: (lines.lapLine && lines.lapLine.p1 && lines.lapLine.p2) ? cloneLine(lines.lapLine) : null,
        sectors: sectorsObj,
        lapIntervalM
    };

    const list = getCustomCourseList();
    list.push(payload);
    localStorage.setItem(CUSTOM_COURSE_STORAGE_KEY, JSON.stringify(list));

    nameInput.value = '';
    updateCourseSelectMenu(id);
    document.getElementById('selectedCourseDisplay').textContent = `${name} 保存完了`;
    alert(`マイコース「${name}」を保存しました。`);
}

function applySelectedCustomCourse() {
    if (!isAuthenticated()) return;
    const id = document.getElementById('courseSelect').value;
    if (!id) {
        alert("反映するマイコースを選択してください。");
        return;
    }
    const list = getCustomCourseList();
    const item = list.find(c => c.id === id);
    if (!item) return;

    lines = {
        startLine: cloneLine(item.startLine),
        goalLine: cloneLine(item.goalLine),
        turnLine: cloneLine(item.turnLine),
        lapLine: cloneLine(item.lapLine),
        sectors: {}
    };
    SECTOR_KEYS.forEach(k => {
        lines.sectors[k] = item.sectors ? cloneLine(item.sectors[k]) : null;
    });

    applyTurnReturnRules(false);

    const mode = item.courseMode || 'marathon';
    const targetLaps = Math.max(0, Math.floor(Number(item.targetLaps) || 0));
    const lapIntervalM = Math.max(0, Math.floor(Number(item.lapIntervalM) || 0));

    document.getElementById('courseModeSelect').value = mode;
    document.getElementById('circuitLapsInput').value = String(targetLaps);
    document.getElementById('lapIntervalInput').value = String(lapIntervalM);
    syncCourseModeUI();

    saveAllSettings();
    updatePointUI();
    redrawLines();
    document.getElementById('selectedCourseDisplay').textContent = `${item.name} 反映完了`;

    const firstSectorLine = SECTOR_KEYS.map(k => lines.sectors[k]).find(Boolean);
    const focusLine = lines.lapLine || lines.startLine || lines.turnLine || firstSectorLine || lines.goalLine;
    if (focusLine && focusLine.p1) {
        map.setView([focusLine.p1.lat, focusLine.p1.lon], 17);
    }
}

function deleteSelectedCustomCourse() {
    if (!isAuthenticated()) return;
    const selectEl = document.getElementById('courseSelect');
    const id = selectEl.value;
    if (!id) return;
    const name = selectEl.options[selectEl.selectedIndex].text;
    if (!confirm(`マイコース「${name}」を削除しますか？`)) return;

    const filtered = getCustomCourseList().filter(c => c.id !== id);
    localStorage.setItem(CUSTOM_COURSE_STORAGE_KEY, JSON.stringify(filtered));
    updateCourseSelectMenu('');
    document.getElementById('selectedCourseDisplay').textContent = '未選択';
}

function loadSavedState() {
    ['startLine', 'goalLine', 'turnLine', 'lapLine'].forEach(key => {
        lines[key] = readLineFromStorage(key);
    });
    SECTOR_KEYS.forEach(key => {
        lines.sectors[key] = readLineFromStorage(key);
    });

    document.getElementById('courseModeSelect').value = localStorage.getItem('klap_course_mode') || 'marathon';
    const interval = Number(localStorage.getItem('marathon_lap_interval_m'));
    document.getElementById('lapIntervalInput').value = (!isNaN(interval) && interval >= 0) ? interval : 0;

    const cLaps = Number(localStorage.getItem('klap_circuit_laps'));
    document.getElementById('circuitLapsInput').value = (!isNaN(cLaps) && cLaps >= 0) ? cLaps : 0;

    applyTurnReturnRules(false);
    syncCourseModeUI();
    updateCourseSelectMenu('');
    updatePointUI();
    redrawLines();
}

function saveAllSettings() {
    if (!isAuthenticated()) return;
    applyTurnReturnRules(false);

    ['startLine', 'goalLine', 'turnLine', 'lapLine'].forEach(key => {
        const line = lines[key];
        saveLineToStorage(key, (line && line.p1 && line.p2) ? line : null);
    });
    SECTOR_KEYS.forEach(key => {
        const line = lines.sectors[key];
        saveLineToStorage(key, (line && line.p1 && line.p2) ? line : null);
    });

    const mode = document.getElementById('courseModeSelect').value;
    const interval = Math.max(0, Math.floor(Number(document.getElementById('lapIntervalInput').value) || 0));
    const cLaps = Math.max(0, Math.floor(Number(document.getElementById('circuitLapsInput').value) || 0));

    localStorage.setItem('klap_course_mode', mode);
    localStorage.setItem('marathon_lap_interval_m', String(interval));
    localStorage.setItem('klap_circuit_laps', String(cLaps));
}

function guardTopBarEvents() {
    const topBar = document.getElementById('topBar');
    ['mousedown', 'touchstart', 'pointerdown'].forEach(evtName => {
        topBar.addEventListener(evtName, (e) => {
            e.stopPropagation();
        }, { passive: true });
    });
}

function initializeAppOnce() {
    if (appInitialized || !isAuthenticated()) return;
    appInitialized = true;

    initSelectorOptions();
    guardTopBarEvents();

    map = L.map('map', { zoomControl: true }).setView([35.68, 139.76], 16);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
        maxZoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
    }).addTo(map);

    map.on('click', (e) => {
        if (!isAuthenticated() || isDraggingEndpoint) return;
        setPointCoord(e.latlng.lat, e.latlng.lng, activePoint);
    });

    document.getElementById('setP1Btn').onclick = (e) => {
        e.stopPropagation();
        activePoint = 'p1';
        setDrawMode(drawMode);
    };
    document.getElementById('setP2Btn').onclick = (e) => {
        e.stopPropagation();
        activePoint = 'p2';
        setDrawMode(drawMode);
    };

    document.getElementById('putP1CenterBtn').onclick = (e) => {
        e.stopPropagation();
        const c = map.getCenter();
        activePoint = 'p1';
        setPointCoord(c.lat, c.lng, 'p1');
    };
    document.getElementById('putP2CenterBtn').onclick = (e) => {
        e.stopPropagation();
        const c = map.getCenter();
        activePoint = 'p2';
        setPointCoord(c.lat, c.lng, 'p2');
    };

    document.getElementById('gpsBtn').onclick = (e) => {
        e.stopPropagation();
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(pos => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 17);
        }, () => {}, { enableHighAccuracy: true });
    };

    document.getElementById('modeStartBtn').onclick = (e) => { e.stopPropagation(); setDrawMode('startLine'); };
    document.getElementById('modeGoalBtn').onclick = (e) => { e.stopPropagation(); setDrawMode('goalLine'); };
    document.getElementById('modeTurnBtn').onclick = (e) => { e.stopPropagation(); setDrawMode('turnLine'); };
    document.getElementById('modeLapBtn').onclick = (e) => { e.stopPropagation(); setDrawMode('lapLine'); };
    document.getElementById('modeSecBtn').onclick = (e) => { e.stopPropagation(); setDrawMode('sector'); };
    document.getElementById('sectorNumSelect').onchange = () => {
        if (drawMode === 'sector') setDrawMode('sector');
    };

    document.getElementById('courseSelect').onchange = toggleDeleteCourseButton;
    document.getElementById('applyCourseBtn').onclick = (e) => { e.stopPropagation(); applySelectedCustomCourse(); };
    document.getElementById('deleteCourseBtn').onclick = (e) => { e.stopPropagation(); deleteSelectedCustomCourse(); };
    document.getElementById('saveNewCourseBtn').onclick = (e) => { e.stopPropagation(); saveNewCustomCourse(); };

    document.getElementById('clearLineBtn').onclick = (e) => {
        e.stopPropagation();
        if (!isAuthenticated()) return;
        const key = getActiveLineKey();
        setLineByKey(key, null);
        saveLineToStorage(key, null);
        applyTurnReturnRules(false);
        updatePointUI();
        redrawLines();
    };

    document.getElementById('clearAllBtn').onclick = (e) => {
        e.stopPropagation();
        if (!isAuthenticated()) return;
        lines = { startLine: null, goalLine: null, turnLine: null, lapLine: null, sectors: {} };
        ['startLine', 'goalLine', 'turnLine', 'lapLine'].forEach(k => saveLineToStorage(k, null));
        SECTOR_KEYS.forEach(k => saveLineToStorage(k, null));
        applyTurnReturnRules(false);
        updatePointUI();
        redrawLines();
    };

    document.getElementById('courseModeSelect').onchange = syncCourseModeUI;

    document.getElementById('saveBtn').onclick = (e) => {
        e.stopPropagation();
        saveAllSettings();
        if (isAuthenticated()) location.href = 'klap-marw.html';
    };

    document.getElementById('goTimerBtn').onclick = (e) => {
        e.stopPropagation();
        saveAllSettings();
        if (isAuthenticated()) location.href = 'klap-marw.html';
    };

    loadSavedState();
    setDrawMode('startLine');
}

window.onload = () => {
    document.getElementById('authSubmitBtn').onclick = verifyPasswordInput;
    document.getElementById('authPassInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') verifyPasswordInput();
    });

    if (ensureAuthOrLock()) {
        initializeAppOnce();
    }
};

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Register Failed!', err));
    });
}
</script>
